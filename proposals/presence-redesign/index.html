<head>

<title>الحضور والانصراف — نموذج التصميم (بيانات محاكاة)</title>
<style>
@font-face{font-family:"TajawalP";src:url(fonts/Tajawal-Regular.ttf);font-weight:400}

*{box-sizing:border-box}html,body{margin:0}

.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin:14px 0}

.box>header .cnt{font-size:24px;font-weight:700}
.b-neg>header{background:linear-gradient(180deg,#FDF1EE,#fff)}.b-neg .bi{background:var(--neg-t);color:var(--neg)}.b-neg .cnt{color:var(--neg)}
.b-amber>header{background:linear-gradient(180deg,#FEF7E8,#fff)}.b-amber .bi{background:var(--amber-t);color:var(--amber)}.b-amber .cnt{color:var(--amber)}
.b-blue>header{background:linear-gradient(180deg,#EEF5FC,#fff)}.b-blue .bi{background:var(--blue-t);color:var(--blue)}.b-blue .cnt{color:var(--blue)}
.rows{list-style:none;margin:0;padding:4px 8px 8px;display:grid;gap:2px}
.row{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 6px;border-radius:10px}.row:hover{background:#F8FAFD}.row.abs{grid-template-columns:38px minmax(0,1fr) auto}.acts-c .acts{margin:0}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13.5px;color:#fff;background:var(--col,#6B7688);position:relative;flex:none}
.av.sm{width:32px;height:32px;font-size:12px}
.av[class*=st-]::after{content:"";position:absolute;inset-inline-end:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid #fff;background:var(--sc)}
.st-in{--sc:var(--pos)}.st-break{--sc:#E39A1F}.st-out{--sc:#9AA4B5}.st-none{--sc:var(--neg)}.st-up{--sc:#9DB3E6}.st-leave{--sc:var(--blue)}

.person:hover .kebab,.kebab:focus{opacity:1}
.more{border:0;background:transparent;color:var(--primary);font-weight:700;padding:8px 14px;text-align:start;border-top:1px solid var(--border);display:flex;gap:6px;align-items:center;width:100%}
.side{display:grid;gap:14px}
.panel{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}

.fi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;flex:none}.fi.in{background:var(--pos-t);color:var(--pos)}.fi.out{background:var(--out-t);color:var(--out)}.fi.break{background:var(--amber-t);color:var(--amber)}
.feed b{display:block;font-size:14px;line-height:1.3}.feed span{font-size:12.5px;color:var(--muted)}.feed time{margin-inline-start:auto;font-size:12.5px;color:var(--muted);direction:ltr}

.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:14px}

 else{const WB=bucketize(a,r.tbl,from);const vmax=Math.max(1,...WB.per.flatMap(x=>x.vals.map(v=>v.late)));const sorted=[...WB.per].sort((x,y)=>y.vals.reduce((s2,v)=>s2+v.late,0)-x.vals.reduce((s2,v)=>s2+v.late,0));const shown=r.showAll?sorted:sorted.slice(0,12);

  r._total=sorted.length}
 $('#app').innerHTML=`<div class="bar sticky" style="margin-top:14px"><div class="chips" role="group" aria-label="الفترة">${P.map(p=>`<button class="chip" data-p="${p[0]}" aria-pressed="${r.period===p[0]}">${p[0]==='custom'?ico('i-cal'):''}${p[1]}</button>`).join('')}</div>${r.period==='custom'?`<input type="date" class="dt" id="dFrom" value="${dateOf(r.from).toISOString().slice(0,10)}" aria-label="من"><span>←</span><input type="date" class="dt" id="dTo" value="${dateOf(r.to).toISOString().slice(0,10)}" aria-label="إلى">`:''}<span style="margin-inline-start:auto;color:var(--muted);font-size:13px">${dlabel(from)} ← ${dlabel(to)} · ${len} يوم${prev?' · مقارنة مع '+len+' يوم قبلها':''}</span></div>
 <div class="bar" style="margin-top:10px"><label class="search">${ico('i-search')}<span class="sr">بحث</span><input id="rq" value="${E(r.q)}" placeholder="موظف أو قسم…" autocomplete="off"></label><select class="sel" id="rd" aria-label="القسم"><option value="all">كل الأقسام</option>${Object.keys(DEPTS).map(k=>`<option value="${k}" ${r.dept===k?'selected':''}>${DEPTS[k].n}</option>`).join('')}</select><select class="sel" id="rt" aria-label="النوع"><option value="all">كل الحالات</option><option value="late" ${r.type==='late'?'selected':''}>التأخير فقط</option><option value="abs" ${r.type==='abs'?'selected':''}>الغياب فقط</option></select><label class="tool" style="cursor:pointer"><input type="checkbox" id="rc" ${r.compare?'checked':''}> قارن بالفترة السابقة</label>
 <span style="margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap"><label class="tool" style="cursor:pointer"><input type="checkbox" id="rm" ${r.money?'checked':''}> الأثر المالي</label><button class="tool" id="sch">${ico('i-cal')}جدولة التقرير</button><button class="tool" id="csv">${ico('i-down')}تصدير CSV</button><button class="tool" id="prt">${ico('i-print')}طباعة</button></span></div>
 <section class="rkpis">${K.map(k=>`<div class="rk"><span class="l">${ico(k[0])}${k[1]}</span><b>${k[2]}</b>${k[3]||'<span class="delta d-flat">—</span>'}</div>`).join('')}</section>
 ${ins.length?`<section class="ins">${ins.map(i=>`<div style="color:${i[1]}">${ico(i[0])}<span style="color:var(--dark)"><b>${E(i[2])}</b><small style="color:var(--muted)">${E(i[3])}</small></span></div>`).join('')}</section>`:''}
 <div class="grid2"><section class="card"><h4>${ico('i-chart')}${{late:'مرات التأخير',min:'دقائق التأخير',abs:'أيام الغياب'}[r.metric]} ${{day:'حسب اليوم',week:'حسب الأسبوع',month:'حسب الشهر'}[r.group]}</h4><div class="mode"><span class="seg" role="group" aria-label="المؤشر">${[['late','مرات'],['min','دقائق'],['abs','غياب']].map(m=>`<button data-m="${m[0]}" aria-pressed="${r.metric===m[0]}">${m[1]}</button>`).join('')}</span><span class="seg" role="group" aria-label="التجميع">${[['day','يومي'],['week','أسبوعي'],['month','شهري']].map(m=>`<button data-g="${m[0]}" aria-pressed="${r.group===m[0]}">${m[1]}</button>`).join('')}</span></div>${barChart(cd,key,col)}</section>
 <section class="card"><h4>${ico('i-grid')}الالتزام حسب ${r.by==='dept'?'القسم':'الوردية'}<span class="seg" role="group">${[['dept','قسم'],['shift','وردية']].map(m=>`<button data-by="${m[0]}" aria-pressed="${r.by===m[0]}">${m[1]}</button>`).join('')}</span></h4>${bd.map(x=>`<div class="hbar" style="--col:${grpCol(x[0])}"><span>${grpName(x[0])}</span><div class="tr"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join('')||'<div class="empty">لا بيانات</div>'}</section></div>
 <div class="grid3"><section class="card"><h4>${ico('i-cal')}خريطة التأخير (آخر 12 أسبوع)</h4>${heat}<div class="legend" style="margin:8px 0 0"><span>أفتح = أقل</span><span>أغمق = دقائق تأخير أكتر</span></div></section><section class="card"><h4>${ico('i-alarm')}الأكثر تأخيرًا</h4><ul class="lb">${worst.map((p,i)=>lbRow(p,i,'w')).join('')||'<li class="empty">لا بيانات</li>'}</ul></section><section class="card"><h4>${ico('i-ok')}الأكثر التزامًا</h4><ul class="lb">${best.map((p,i)=>lbRow(p,i,'b')).join('')||'<li class="empty">لا بيانات</li>'}</ul></section></div>
 ${(()=>{const w=a.per.filter(p=>p.sched>=6&&(p.commit<75||p.late>=5||p.absent>=3)).sort((x,y)=>x.commit-y.commit).slice(0,4);return w.length?`<section class="card" style="margin-bottom:14px"><h4>${ico('i-warn')}تحتاج قرارًا منك <small style="color:var(--muted);font-weight:400">(التزام أقل من 75% أو تأخير متكرر أو غياب)</small></h4><div class="watch">${w.map(p=>`<div class="wi"><span class="av" style="--col:${DEPTS[p.e.dept].col}">${E(initials(p.e.name))}</span><div class="nm"><span class="t">${E(p.e.name)}</span><small>${DEPTS[p.e.dept].n} · ${E(p.e.role)}</small><div class="why"><span class="pill p-none">التزام ${p.commit}%</span>${p.late?`<span class="pill p-late">${p.late} تأخير (${p.lateMin} د)</span>`:''}${p.absent?`<span class="pill p-none">${p.absent} غياب</span>`:''}</div></div><div class="wacts"><button class="mini" data-toast="يفتح ملف الموظف وسجل حضوره">${ico('i-users')}ملف الموظف</button><button class="mini" data-toast="يرسل تنبيهًا ودّيًا للموظف">${ico('i-msg')}تنبيه</button><button class="mini" data-toast="يفتح جدول الورديات لتعديل وردية الموظف">${ico('i-cal')}راجع الوردية</button></div></div>`).join('')}</div></section>`:''})()}
 <section class="card"><h4>${ico('i-users')}تفصيل الموظفين</h4><div class="mode"><span class="seg" role="group" aria-label="نوع الجدول">${[['sum','ملخص الفترة'],['week','أسبوعيًا'],['month','شهريًا']].map(m=>`<button data-t="${m[0]}" aria-pressed="${r.tbl===m[0]}">${m[1]}</button>`).join('')}</span><small style="color:var(--muted)">${r.tbl==='sum'?'اضغط على العنوان للترتيب':'الأرقام = مرات التأخير في كل '+(r.tbl==='week'?'أسبوع':'شهر')+'. مرّر الماوس لرؤية الدقائق والغياب'}</small></div><div class="scroll"><table class="tbl"><thead>${head}</thead><tbody>${rows}</tbody></table></div>${r._total>12?`<div style="text-align:center;margin-top:10px"><button class="mini" id="showAll">${r.showAll?'عرض أقل':'عرض كل الموظفين ('+r._total+')'}</button></div>`:''}${r.money&&r.tbl==='sum'?'<small style="color:var(--muted)">* تقدير بسعر 1.5 ج للدقيقة (قيمة تجريبية). قواعد الأجر الفعلية لسه ما اتعتمدتش في الداشبورد، فده مؤشر فقط.</small>':''}</section>`;
 const A=$('#app');
 A.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{r.period=b.dataset.p;renderReports()});
 A.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));

 const df=$('#dFrom'),dt=$('#dTo');if(df){const toIdx=v=>Math.round((new Date(v+'T00:00:00')-new Date(TODAY.getFullYear(),TODAY.getMonth(),TODAY.getDate()))/864e5);df.onchange=()=>{r.from=Math.max(-(NH-1),toIdx(df.value));renderReports()};dt.onchange=()=>{r.to=Math.min(0,toIdx(dt.value));renderReports()}}
 $('#prt').onclick=()=>window.print();$('#sch').onclick=()=>toast('يرسل هذا التقرير تلقائيًا للمدير كل أسبوع (واتساب/إيميل) — فكرة قيد الاعتماد');
 $('#csv').onclick=()=>{const rows2=[['الموظف','القسم','أيام العمل','مرات التأخير','دقائق التأخير','الغياب','الإجازات','الالتزام%']].concat(a.per.map(p=>[p.e.name,DEPTS[p.e.dept].n,p.sched,p.late,p.lateMin,p.absent,p.leave,p.commit]));const blob=new Blob(['﻿'+rows2.map(x=>x.join(',')).join('\n')],{type:'text/csv'});const u=URL.createObjectURL(blob),l=document.createElement('a');l.href=u;l.download='attendance-report.csv';l.click();URL.revokeObjectURL(u);toast('تم تصدير التقرير (بيانات محاكاة)')}}

/* ---------- نافذة الربط + التنقل ---------- */
let dtab='unmapped';

function drawDlg(){const tabs=[['unmapped','غير مربوطة',UNMAPPED.length],['ignored','متجاهلة (غير إدارية)',IGNORED.length],['none','مربوطون ولم يبصموا',cnt(e=>stateOf(e)==='absent')]];
 $('#dtabs').innerHTML=tabs.map(t=>`<button role="tab" aria-selected="${dtab===t[0]}" data-t="${t[0]}">${t[1]} (${t[2]})</button>`).join('');
 const opts=EMP.map(p=>`<option>${E(p.name)} — ${DEPTS[p.dept].n}</option>`).join('');let h='';
 if(dtab==='unmapped')h=UNMAPPED.map(u=>`<div class="dr"><span class="num">${u.num}</span><div class="tx"><b>رقم الجهاز ${u.num}</b><small>آخر بصمة ${hhmm(SIM-u.last)} · منذ ${dur(u.last)}</small></div><select aria-label="اختر الموظف"><option>اختر الموظف…</option>${opts}</select><button class="mini solid">ربط</button><button class="mini" title="لا يظهر في الحضور (مثل الأطباء)">${ico('i-eyeoff')} تجاهل</button></div>`).join('');
 if(dtab==='ignored')h=IGNORED.map(u=>`<div class="dr"><span class="num" style="background:var(--out-t);color:var(--out)">${u.num}</span><div class="tx"><b>رقم الجهاز ${u.num}</b><small>مخفي من «الحضور» · آخر بصمة ${hhmm(SIM-u.last)}</small></div><button class="mini">إلغاء التجاهل</button></div>`).join('');
 if(dtab==='none')h=EMP.filter(e=>stateOf(e)==='absent').map(p=>`<div class="dr"><span class="num">${E(initials(p.name))}</span><div class="tx"><b>${E(p.name)}</b><small>${DEPTS[p.dept].n} · ${E(p.role)}</small></div><button class="mini">تغيير الربط</button></div>`).join('');
 $('#dbody').innerHTML=h||'<div class="empty">لا يوجد شيء هنا.</div>';$('#dtabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{dtab=b.dataset.t;drawDlg()})}
$('#closeDlg').onclick=()=>$('#dlg').close();

$('#refresh').onclick=()=>{render();toast('تم التحديث')};
const url=new URLSearchParams(location.search);if(url.get('tab'))S.tab=url.get('tab');if(url.get('view'))S.now.view=url.get('view');if(url.get('period'))S.rep.period=url.get('period');if(url.get('group'))S.rep.group=url.get('group');if(url.get('tbl'))S.rep.tbl=url.get('tbl');if(url.get('by'))S.rep.by=url.get('by');if(url.get('all'))S.rep.showAll=true;if(url.get('state'))S.now.state=url.get('state');if(url.get('money'))S.rep.money=true;if(url.get('out'))Object.keys(DEPTS).forEach(k=>S.now.openOut[k]=true);
render();if(url.get('dlg'))openDlg(url.get('dlg'));document.body.dataset.ready='1';

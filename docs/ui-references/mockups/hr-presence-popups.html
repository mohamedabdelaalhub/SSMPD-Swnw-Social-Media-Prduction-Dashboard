<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تصور — الحضور اللحظي: نوافذ بدل الفلتر</title>
<!-- Mockup only. Names are placeholders. -->
<style>
:root{--blue:#0F369D;--orange:#F15A22;--ink:#16212E;--pos:#2F7D5C;--neg:#D0402A;--bg:#EEF0F5;--line:#E1E5EE;--muted:#6B7483}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Kaku","BigVesta Arabic",system-ui,Tahoma,sans-serif;font-size:14px;padding:14px}
.wrap{max-width:560px;margin:0 auto;display:grid;gap:14px}
.note{background:#fff;border:1px dashed var(--blue);border-radius:12px;padding:10px 14px;color:var(--blue);font-size:13px;line-height:1.7}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.k{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px;text-align:start;font:inherit;cursor:pointer;display:grid;gap:4px;transition:transform .15s,box-shadow .15s}
.k:hover,.k:focus-visible{transform:translateY(-2px);box-shadow:0 8px 20px rgba(15,54,157,.12);outline:none}
.k span{color:var(--muted);font-size:13px;white-space:nowrap}.k b{font-size:30px;line-height:1.1}
.k.in b{color:var(--blue)}.k.ab b,.k.late b{color:var(--neg)}.k.out b{color:#4C566A}
.k i{display:block;height:6px;border-radius:9px;background:var(--line);margin-top:4px;overflow:hidden}.k i em{display:block;height:100%;background:currentColor;border-radius:9px}
.k.in i{color:var(--blue)}.k.out i{color:#8A93A6}.k.ab i,.k.late i{color:var(--neg)}.k.lv i{color:var(--pos)}.k.up i{color:#8A93A6}
.hint{color:var(--muted);font-size:12px;text-align:center}
.dept{background:#fff;border:1px solid var(--line);border-radius:20px;overflow:hidden}
.dh{display:flex;align-items:center;gap:12px;padding:14px;width:100%;border:0;background:none;font:inherit;cursor:pointer;text-align:start}
.dh:hover{background:#F6F8FD}
.ic{flex:none;width:44px;height:44px;border-radius:14px;color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px}
.dh .t{flex:1;min-width:0}.dh h3{margin:0;font-size:16px}.dh small{color:var(--muted)}
.chev{color:var(--muted);font-size:18px}
.ppl{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.p{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px 5px 6px;font:inherit;cursor:pointer;white-space:nowrap}
.p:hover{background:#F6F8FD}
.av{width:28px;height:28px;border-radius:50%;background:#E8EEFC;color:var(--blue);display:grid;place-items:center;font-size:12px;position:relative}
.av::after{content:"";position:absolute;bottom:-1px;inset-inline-start:-1px;width:10px;height:10px;border-radius:50%;border:2px solid #fff;background:var(--c,#9AA3B5)}
.s-in{--c:var(--pos)}.s-out{--c:#9AA3B5}.s-up{--c:#C5CAD6}.s-ab{--c:var(--neg)}.s-late{--c:var(--orange)}.s-lv{--c:#1E9BD7}
.ov{position:fixed;inset:0;background:rgba(22,33,46,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:50}
.ov.on{display:flex}
.pop{background:#fff;border-radius:22px;width:100%;max-width:440px;max-height:86vh;overflow:auto;padding:16px;animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.ph h3{margin:0;font-size:17px}
.x{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
.row{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);width:100%;background:none;border-inline:0;border-top:0;font:inherit;text-align:start;cursor:pointer}
.row:last-child{border-bottom:0}.row .n{flex:1;min-width:0}.row .n b{display:block}.row .n small{color:var(--muted)}
.chip{flex:none;background:#EEF1F7;border-radius:99px;padding:4px 10px;font-size:12px;white-space:nowrap}
.dl{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:6px 0 0}.dl dt{color:var(--muted)}.dl dd{margin:0;font-weight:700}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}.sum div{background:#F6F8FD;border-radius:12px;padding:8px;text-align:center}.sum b{display:block;font-size:20px}.sum small{color:var(--muted)}
.back{border:0;background:none;color:var(--blue);font:inherit;cursor:pointer;padding:6px 0;margin-bottom:6px}
</style></head><body><div class="wrap">
<div class="note">جرّب: دوس على أي مربع فوق (موجودون/غايبون/…) تفتح نافذة بالأسماء. ودوس على اسم قسم أو على موظف تفتح نافذة بالتفاصيل. مفيش «فلتر نشط» ولا «إلغاء الفلتر» خالص.</div>
<section class="kpis" id="kpis"></section><div class="hint">دوس على أي مربع تشوف مين جواه</div>
<div id="depts" class="wrap" style="padding:0"></div></div>
<div class="ov" id="ov"><div class="pop" id="pop" role="dialog" aria-modal="true"></div></div>
<script>
var ST={in:['موجود الآن','in'],out:['انصرف','out'],up:['لم يبدأ بعد','up'],ab:['غايب','ab'],late:['متأخر','late'],lv:['في إجازة','lv']};
var P=[['وضاحة الشيخ الحاج','تمريض','out','انصرف 23:54','07:05 → 23:54','7 س 49 د','تمريض ليلي','التمريض'],['هدى حمدى ابراهيم','تمريض','out','انصرف 22:14','14:30 → 22:14','7 س 28 د','تمريض مساء','التمريض'],['سارة عادل','تمريض','in','موجود منذ 08:02','08:02 → —','5 س 10 د','تمريض صباحي','التمريض'],['منى فتحي','تمريض','up','يبدأ 16:00','—','—','تمريض مساء','التمريض'],['كريم نبيل','تمريض','up','يبدأ 16:00','—','—','تمريض مساء','التمريض'],
['أحمد سمير','أسنان','in','موجود منذ 09:10','09:10 → —','4 س 02 د','طبيب أسنان','الأسنان'],['ياسمين خالد','أسنان','up','يبدأ 14:00','—','—','مساعد أسنان','الأسنان'],['محمود رضا','أسنان','out','انصرف 15:30','08:00 → 15:30','7 س 30 د','فني معمل','الأسنان'],['إيمان حسن','استقبال','out','انصرف 16:00','08:00 → 16:00','8 س','موظفة استقبال','الاستقبال'],['طارق فوزي','استقبال','up','يبدأ 16:00','—','—','موظف استقبال','الاستقبال']];
var D=[['التمريض','#1E9BD7'],['الأسنان','#0F369D'],['الاستقبال','#2F7D5C']];
function ini(n){return n.charAt(0)}
var cnt=function(s){return P.filter(function(p){return p[2]===s}).length};
var K=[['in','موجودون الآن'],['ab','غايبون'],['late','متأخرون'],['lv','في إجازة'],['up','لم يبدأوا بعد'],['out','انصرفوا']];
document.getElementById('kpis').innerHTML=K.map(function(k){var n=cnt(k[0]);return '<button class="k '+k[0]+'" data-k="'+k[0]+'"><span>'+k[1]+'</span><b>'+n+'</b><i><em style="width:'+Math.round(n/P.length*100)+'%"></em></i></button>'}).join('');
document.getElementById('depts').innerHTML=D.map(function(d,i){var l=P.filter(function(p){return p[7]===d[0]});var inn=l.filter(function(p){return p[2]==='in'}).length;
return '<section class="dept"><button class="dh" data-d="'+i+'"><span class="ic" style="background:'+d[1]+'">'+d[0].charAt(0)+'</span><span class="t"><h3>'+d[0]+'</h3><small>'+inn+' موجود من '+l.length+'</small></span><span class="chev">‹</span></button><div class="ppl">'+l.map(function(p){return '<button class="p" data-p="'+P.indexOf(p)+'"><span class="av s-'+p[2]+'">'+ini(p[0])+'</span>'+p[0].split(' ').slice(0,2).join(' ')+'</button>'}).join('')+'</div></section>'}).join('');
var ov=document.getElementById('ov'),pop=document.getElementById('pop'),stack=[];
function show(h){pop.innerHTML=h;ov.classList.add('on')}
function rows(l){return l.map(function(p){return '<button class="row" data-p="'+P.indexOf(p)+'"><span class="av s-'+p[2]+'">'+ini(p[0])+'</span><span class="n"><b>'+p[0]+'</b><small>'+p[7]+'</small></span><span class="chip">'+p[3]+'</span></button>'}).join('')||'<p class="hint">مفيش حد هنا دلوقتي</p>'}
function list(k){var l=P.filter(function(p){return p[2]===k});stack=['k:'+k];show('<div class="ph"><h3>'+K.filter(function(x){return x[0]===k})[0][1]+' ('+l.length+')</h3><button class="x" data-c aria-label="إغلاق">✕</button></div>'+rows(l))}
function dept(i){var l=P.filter(function(p){return p[7]===D[i][0]});stack=['d:'+i];show('<div class="ph"><h3>'+D[i][0]+'</h3><button class="x" data-c aria-label="إغلاق">✕</button></div><div class="sum"><div><b>'+l.filter(function(p){return p[2]==='in'}).length+'</b><small>موجودون</small></div><div><b>'+l.filter(function(p){return p[2]==='up'}).length+'</b><small>لم يبدأوا</small></div><div><b>'+l.filter(function(p){return p[2]==='out'}).length+'</b><small>انصرفوا</small></div></div>'+rows(l))}
function person(i){var p=P[i];var prev=stack[stack.length-1];show((prev&&prev.indexOf('p:')<0?'<button class="back" data-b>‹ رجوع</button>':'')+'<div class="ph"><h3>'+p[0]+'</h3><button class="x" data-c aria-label="إغلاق">✕</button></div><dl class="dl"><dt>القسم</dt><dd>'+p[7]+'</dd><dt>الوظيفة</dt><dd>'+p[6]+'</dd><dt>الحالة</dt><dd>'+ST[p[2]][0]+'</dd><dt>الحضور والانصراف</dt><dd>'+p[4]+'</dd><dt>مدة العمل</dt><dd>'+p[5]+'</dd></dl>')}
document.addEventListener('click',function(e){var t=e.target.closest('[data-k],[data-d],[data-p],[data-c],[data-b]');if(e.target===ov){ov.classList.remove('on');return}if(!t)return;
if(t.dataset.k)list(t.dataset.k);else if(t.dataset.d!=null)dept(+t.dataset.d);else if(t.dataset.p!=null)person(+t.dataset.p);else if(t.dataset.c!=null)ov.classList.remove('on');else if(t.dataset.b!=null){var s=stack[0];s.charAt(0)==='k'?list(s.slice(2)):dept(+s.slice(2))}});
document.addEventListener('keydown',function(e){if(e.key==='Escape')ov.classList.remove('on')});
</script></body></html>

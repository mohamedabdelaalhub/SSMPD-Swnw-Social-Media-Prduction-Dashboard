<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>تصور: الباكجز وأرصدة المرضى</title>
<style>
@font-face{font-family:"Hiragino Kaku";src:url(../../../assets/fonts/Hiragino-W3.woff2) format("woff2");font-weight:400}
@font-face{font-family:"Hiragino Kaku";src:url(../../../assets/fonts/Hiragino-W6.woff2) format("woff2");font-weight:600 800}
@font-face{font-family:"BigVesta Arabic";src:url(../../../assets/fonts/BigVesta-Regular.woff2) format("woff2");font-weight:400}
@font-face{font-family:"BigVesta Arabic";src:url(../../../assets/fonts/BigVesta-Bold.woff2) format("woff2");font-weight:600 800}
:root{--brand:#0F369D;--accent:#F15A22;--ink:#16212E;--muted:#667085;--line:#E6EBF3;--soft:#F3F6FB;--tint:#EAF0FF;--teal:#00B0BD;--pos:#2F7D5C;--neg:#D0402A;--gap:16px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Hiragino Kaku","BigVesta Arabic",system-ui,Tahoma,sans-serif;color:var(--ink);background:#EEF2F8;font-size:14px}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{max-width:1180px;margin:16px auto 0;padding:0 16px;color:var(--muted);font-size:12px}.note b{color:var(--brand)}
.wrap{max-width:1180px;margin:12px auto 24px;padding:0 16px;display:grid;gap:var(--gap)}
.card{background:#fff;border-radius:24px;box-shadow:0 6px 24px rgba(15,54,157,.06);padding:20px}
.seg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;background:#fff;border-radius:18px;padding:6px;box-shadow:0 6px 24px rgba(15,54,157,.06)}
.seg button{min-height:44px;border:0;border-radius:14px;background:none;color:var(--muted);font-weight:600;white-space:nowrap}
.seg button.on{background:var(--brand);color:#fff}
.view{display:none;gap:var(--gap)}.view.on{display:grid}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--gap)}
.tile{border:0;text-align:start;background:#fff;border-radius:20px;padding:16px;box-shadow:0 6px 24px rgba(15,54,157,.06);display:grid;gap:6px;min-width:0}
.tile small{color:var(--muted);font-size:12px}.tile b{font-size:22px;color:var(--brand)}.tile span{font-size:12px;color:var(--muted)}
.tile.warn b{color:#B4540A}.tile.ok b{color:var(--pos)}
.tile:hover{outline:2px solid var(--tint)}
.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:14px;padding:0 12px;height:44px;color:var(--muted)}
.search input{border:0;background:none;outline:0;flex:1;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{min-height:36px;border-radius:12px;border:1px solid var(--line);background:#fff;padding:0 12px;font-size:12px;white-space:nowrap;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.chips button.on{background:var(--tint);border-color:#CFDCF8;color:var(--brand);font-weight:600}
.chips i{font-style:normal;font-size:11px}
.period{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.period .chips button{min-height:36px}
.btn{min-height:44px;border-radius:14px;border:1px solid var(--line);background:#fff;padding:0 16px;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-weight:600;color:var(--brand);justify-content:center}
.btn.main{background:#16212E;border-color:#16212E;color:#fff;transition:background-color .2s,border-color .2s,box-shadow .2s}
.btn.main:hover,.btn.main:focus-visible{background:var(--accent);border-color:var(--accent);box-shadow:0 6px 16px rgba(241,90,34,.28)}
.btn.main:focus-visible{outline:3px solid #0F369D;outline-offset:2px}
.btn.sm{min-height:40px;padding:0 12px;font-size:13px}
.btn.icon{width:44px;padding:0}
.list{display:grid;gap:12px}
.vcard{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:14px 16px;background:#fff;border-inline-start:4px solid var(--line)}
.vcard.open{border-inline-start-color:var(--teal)}.vcard.wait{border-inline-start-color:#FF8800}.vcard.done{border-inline-start-color:var(--pos)}.vcard.closed{border-inline-start-color:#525B6F}
.av{width:46px;height:46px;border-radius:50%;background:var(--tint);color:var(--brand);display:grid;place-items:center;flex:none}.av svg{width:22px;height:22px}
.mid{display:grid;gap:6px;min-width:0}
.top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.top b{font-size:15px}
.sub{font-size:12px;color:var(--muted)}
.svc{display:flex;gap:6px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;font-size:12px;white-space:nowrap}
.pill.wait{background:#FFF1E0;color:#9A4E00}.pill.done{background:#E6F4EC;color:var(--pos)}.pill.cancel{background:var(--soft);color:var(--muted);text-decoration:line-through}
.st{display:inline-flex;min-height:24px;align-items:center;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.st.open{background:var(--teal);color:#fff}.st.closed{background:#525B6F;color:#fff}
.end{display:grid;justify-items:end;gap:8px}
.amt{font-weight:700;white-space:nowrap}.amt small{font-weight:400;color:var(--muted)}
.due{font-size:12px;color:#B4540A;font-weight:600;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:24px}
.prow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:12px 16px}
.pacts{display:flex;gap:8px;align-items:center}
.menu{position:relative}
.pop{position:absolute;top:50px;inset-inline-end:0;background:#fff;border-radius:16px;box-shadow:0 12px 40px rgba(15,54,157,.18);padding:6px;display:none;z-index:5;min-width:200px}
.pop.on{display:grid}
.pop button{border:0;background:none;text-align:start;padding:10px 12px;border-radius:10px;white-space:nowrap;min-height:44px}
.pop button:hover{background:var(--soft)}
.pop button.danger{color:var(--neg)}
/* modal */
.bd{position:fixed;inset:0;background:rgba(22,33,46,.45);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.bd.on{display:flex}
.modal{background:#fff;border-radius:24px;max-width:640px;width:100%;padding:20px;display:grid;gap:14px;max-height:88vh;overflow:auto}
.mh{display:flex;align-items:flex-start;gap:12px}
.mh .t{flex:1;min-width:0;display:grid;gap:6px}.mh h3{margin:0;font-size:18px}
.x{width:44px;height:44px;border:0;border-radius:12px;background:var(--soft);flex:none}
.orow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--soft)}
.orow .n{display:grid;gap:4px;min-width:0}.orow .n b{font-size:14px}.orow .n small{color:var(--muted);font-size:12px}
.orow.cancel .n b{text-decoration:line-through;color:var(--muted)}
.tot{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tot div{background:var(--soft);border-radius:14px;padding:10px 12px;display:grid;gap:2px}.tot small{font-size:12px;color:var(--muted)}.tot b{font-size:16px}
.tot .rest b{color:#B4540A}
.mf{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.conf{display:grid;gap:10px}.conf h3{margin:0}.conf p{margin:0;color:var(--muted);line-height:1.8}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:14px;padding:10px 16px;font-size:13px;opacity:0;pointer-events:none;transition:.2s;z-index:40}.toast.on{opacity:1}
@media (max-width:900px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){
 :root{--gap:12px}.wrap{padding:0 12px}.bd{padding:12px}.note{padding:0 12px}.card{padding:16px;border-radius:20px}
 .tile b{font-size:19px}
 .vcard{grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px}
 .vcard .end{grid-column:1/-1;grid-template-columns:minmax(0,1fr) auto;align-items:center;justify-items:stretch}
 .prow{grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px}
 .prow .pacts{grid-column:1/-1}.prow .pacts .btn.main{flex:1}
 .orow{grid-template-columns:minmax(0,1fr) auto;}.orow .amt{grid-column:2;grid-row:1}.orow .oa{grid-column:1/-1;display:flex;gap:8px}.orow .oa .btn.main{flex:1}
 .tot b{font-size:14px;white-space:nowrap}.tot small{white-space:nowrap}
 .mf .btn{flex:1}
 .search input{font-size:16px}
}


.pk{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border:1px solid var(--line);border-radius:20px;padding:14px 16px;background:#fff;border-inline-start:4px solid var(--line)}
.pk.k-due{border-inline-start-color:#FF8800}.pk.k-ok{border-inline-start-color:var(--teal)}.pk.k-soon{border-inline-start-color:var(--neg)}.pk.k-ended{border-inline-start-color:#525B6F}
.prog{display:flex;gap:4px;align-items:center;flex-wrap:wrap}.prog i{width:18px;height:8px;border-radius:99px;background:var(--line)}.prog i.on{background:var(--teal)}.prog i.next{background:#FFD3A8}
.prog span{font-size:12px;color:var(--muted);margin-inline-start:6px;white-space:nowrap}
.money{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.money b{color:var(--ink);font-weight:700}.money .d b{color:#B4540A}
.vtl{display:grid;gap:8px}
.vstep{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;background:var(--soft)}
.dot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:#fff;color:var(--muted);border:2px solid var(--line)}
.vstep.done .dot{background:var(--teal);border-color:var(--teal);color:#fff}.vstep.next .dot{border-color:#FF8800;color:#9A4E00}
.h4{margin:4px 0 0;font-size:14px}
.inst{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 14px;border-radius:16px;border:1px solid var(--line)}
.inst small{color:var(--muted);font-size:12px}
.tiles.t3{grid-template-columns:repeat(3,minmax(0,1fr))}
.why{font-size:12px;color:var(--muted)}
@media (max-width:640px){
 .pk{grid-template-columns:auto minmax(0,1fr);gap:10px;padding:12px}.pk .end{grid-column:1/-1;grid-template-columns:minmax(0,1fr) auto;align-items:center;justify-items:stretch}
 .pk .end .pacts{grid-column:1/-1}.pk .end .pacts .btn.main{flex:1}
 .tiles.t3{grid-template-columns:repeat(2,minmax(0,1fr))}.tiles.t3 .tile:last-child{grid-column:1/-1}
 .inst{grid-template-columns:minmax(0,1fr) auto}.inst .btn{grid-column:1/-1}
 .vstep{padding:10px}
 .top-actions{width:100%}.top-actions .btn{flex:1}
}
.top-actions{display:flex;gap:8px;flex-wrap:wrap}
</style>
</head>
<body>
<div class="note"><b>تاب «أرصدة المرضى» الجديد — للمقارنة بجدول «الحساب والفواتير»</b> · بيانات تجربة، مفيش حاجة بتتحفظ.</div>
<div class="wrap">
 <nav class="seg"><button data-v="packages">الباكجز</button><button data-v="balances" class="on">أرصدة المرضى</button></nav>

 <section class="view" id="v-packages">
  <div class="tiles">
   <button class="tile" data-tf="all"><small>باكجز شغالة</small><b>5</b><span>لـ 5 مرضى</span></button>
   <button class="tile warn" data-tf="due"><small>مطلوب تحصيله دلوقتي</small><b>2,300</b><span>ج.م · 2 باكج</span></button>
   <button class="tile" data-tf="week"><small>أقساط الأسبوع ده</small><b>1,500</b><span>ج.م · 2 قسط</span></button>
   <button class="tile" data-tf="soon"><small>صلاحيتها قربت تخلص</small><b style="color:var(--neg)">1</b><span>خلال 30 يوم</span></button>
  </div>
  <div class="card" style="display:grid;gap:14px">
   <div class="bar">
    <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="kq" placeholder="دوّر باسم المريض أو الباكج"></label>
    <div class="top-actions"><button class="btn" data-t="هيفتح تعريف باكج جديد (للمدير بس)">تعريف باكج</button><button class="btn main" data-t="هيفتح التعاقد على باكج لمريض">+ تعاقد على باكج</button></div>
   </div>
   <div class="chips" id="kf"></div>
   <div class="list" id="klist"></div>
  </div>
 </section>

 <section class="view on" id="v-balances">
  <div class="tiles t3">
   <button class="tile warn" data-bf="due"><small>إجمالي على المرضى</small><b>3,050</b><span>ج.م · 4 مرضى</span></button>
   <button class="tile ok" data-bf="credit"><small>أرصدة للمرضى عندنا</small><b>750</b><span>ج.م · 2 مرضى</span></button>
   <button class="tile" data-v="packages"><small>باكجز عليها فلوس</small><b>2</b><span>باكج</span></button>
  </div>
  <div class="card" style="display:grid;gap:14px">
   <div class="bar"><label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="bq" placeholder="دوّر بالاسم أو التليفون أو رقم الملف"></label></div>
   <div class="chips" id="bfc"></div>
   <div class="list" id="blist"></div>
  </div>
 </section>
</div>
<div class="bd" id="bd"><div class="modal" id="mb"></div></div>
<div class="toast" id="toast"></div>
<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),1900);}
const U='<svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',M='<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>';
const money=n=>n.toLocaleString('en-US')+' ج.م';
const K=[
 {id:1,p:'مريم عادل',file:'P-2026-000140',n:'باكج ليزر 6 جلسات',price:4800,paid:2400,due:800,visits:6,done:3,exp:'15 مارس 2027',state:'due',svc:'جلسة ليزر',inst:[['مقدم','1 نوفمبر',1600,'paid'],['زيارة 3','10 نوفمبر',800,'paid'],['زيارة 4','النهارده',800,'due'],['زيارة 5','بعد الزيارة',800,'next'],['زيارة 6','بعد الزيارة',800,'next']]},
 {id:2,p:'يوسف أحمد محمود',file:'P-2026-000123',n:'باكج علاج طبيعي 10 جلسات',price:3000,paid:3000,due:0,visits:10,done:7,exp:'1 فبراير 2027',state:'ok',svc:'جلسة علاج طبيعي',inst:[['المبلغ كامل','20 أكتوبر',3000,'paid']]},
 {id:3,p:'هدى سمير',file:'P-2026-000177',n:'باكج تقويم أسنان',price:18000,paid:6000,due:1500,visits:12,done:4,exp:'30 سبتمبر 2027',state:'due',svc:'متابعة تقويم',inst:[['مقدم 25%','1 أغسطس',4500,'paid'],['قسط','1 أكتوبر',1500,'paid'],['قسط','1 نوفمبر',1500,'due'],['قسط','1 ديسمبر',1500,'next']]},
 {id:4,p:'نادية فؤاد',file:'P-2026-000150',n:'باكج تخاطب 8 جلسات',price:2400,paid:2400,due:0,visits:8,done:7,exp:'5 ديسمبر 2026',state:'soon',svc:'جلسة تخاطب',inst:[['المبلغ كامل','5 سبتمبر',2400,'paid']]},
 {id:5,p:'عمر خالد',file:'P-2026-000045',n:'باكج متابعة حمل',price:2000,paid:2000,due:0,visits:4,done:4,exp:'خلص',state:'ended',svc:'متابعة',inst:[['المبلغ كامل','1 يوليو',2000,'paid']]}];
const B=[{p:'هدى سمير',file:'P-2026-000177',ph:'01000000001',due:1500,why:'قسط باكج تقويم — مستحق من 22 يوم'},{p:'مريم عادل',file:'P-2026-000140',ph:'01100000002',due:800,why:'قسط زيارة 4 في باكج الليزر'},{p:'منى سعيد',file:'P-2026-000210',ph:'01100000000',due:750,why:'فاتورة زيارة النهارده'},{p:'سامح فتحي',file:'P-2026-000099',ph:'',due:0,credit:550,why:'دفع زيادة عن فاتورة 12 نوفمبر'},{p:'نادية فؤاد',file:'P-2026-000150',ph:'01200000003',due:0,credit:200,why:'رصيد من باكج اتلغى'},{p:'كريم حسن',file:'P-2026-000088',ph:'',due:0,credit:0,why:''}];
B.find(b=>b.p==='هدى سمير').old=1;
let kf='all',kq='',bf='all',bq='';
const KS={due:'عليها فلوس',ok:'ماشية تمام',soon:'صلاحيتها قربت',ended:'خلصت'};
function drawK(){const c={all:K.filter(k=>k.state!=='ended').length,due:K.filter(k=>k.state==='due').length,soon:K.filter(k=>k.state==='soon').length,ended:K.filter(k=>k.state==='ended').length};
 $('#kf').innerHTML=[['all','شغالة'],['due','عليها فلوس'],['soon','صلاحيتها قربت'],['ended','خلصت']].map(([k,l])=>`<button class="${kf===k?'on':''}" data-kf="${k}">${l} <i>${c[k]}</i></button>`).join('');
 const rows=K.filter(k=>(kf==='all'?k.state!=='ended':kf==='week'?k.inst.some(i=>i[3]==='due'):k.state===kf)&&(!kq||(k.p+k.n+k.file).includes(kq)));
 $('#klist').innerHTML=rows.length?rows.map(k=>`<article class="pk k-${k.state}"><span class="av">${U}</span><div class="mid"><div class="top"><b>${k.p}</b><span class="sub">${k.n}</span>${k.state==='soon'?'<span class="pill cancel" style="text-decoration:none;background:#FDECEA;color:var(--neg)">الصلاحية '+k.exp+'</span>':''}${k.state==='ended'?'<span class="st closed">خلصت</span>':''}</div>
 <div class="prog">${Array.from({length:k.visits},(_,i)=>`<i class="${i<k.done?'on':i===k.done?'next':''}"></i>`).join('')}<span>${k.done} من ${k.visits} زيارات</span></div>
 <div class="money"><span>التعاقد <b>${money(k.price)}</b></span><span>اتدفع <b>${money(k.paid)}</b></span>${k.due?`<span class="d">مطلوب دلوقتي <b>${money(k.due)}</b></span>`:''}</div></div>
 <div class="end"><div class="pacts">${k.due?`<button class="btn sm main" data-collect="${k.id}">تحصيل ${money(k.due)}</button>`:`<button class="btn sm" data-open="${k.id}">كشف الباكج</button>`}<div class="menu"><button class="btn sm icon" data-menu aria-label="أدوات أكتر">${M}</button><div class="pop"><button data-open="${k.id}">كشف الباكج</button><button data-t="هيفتح التحصيل بطريقتين">تحصيل بطريقتين</button><button data-t="هيفتح تعديل تواريخ الأقساط (للمدير)">تعديل تواريخ الأقساط</button><button class="danger" data-ask="طلب إيقاف الباكج وتسويته|${k.p} — ${k.n}">طلب إيقاف وتسوية</button></div></div></div></div></article>`).join(''):'<p class="empty">مفيش باكجز بالفلتر ده.</p>';}
function drawB(){const c={all:B.filter(b=>b.due||b.credit).length,due:B.filter(b=>b.due).length,credit:B.filter(b=>b.credit).length,old:B.filter(b=>b.old).length};
 $('#bfc').innerHTML=[['all','عليهم أو ليهم'],['due','عليهم فلوس'],['credit','ليهم رصيد']].map(([k,l])=>`<button class="${bf===k||(bf==='old'&&k==='due')?'on':''}" data-bf="${k}">${l} <i>${c[k]}</i></button>`).join('');
 const rows=B.filter(b=>(bf==='all'?(b.due||b.credit):bf==='old'?b.old:b[bf])&&(!bq||(b.p+b.file+b.ph).includes(bq)));
 $('#blist').innerHTML=rows.length?rows.map(b=>`<article class="prow"><span class="av">${U}</span><div class="mid"><div class="top"><b>${b.p}</b>${b.due?`<span class="pill wait">عليه ${money(b.due)}</span>`:''}${b.credit?`<span class="pill done">له ${money(b.credit)}</span>`:''}</div>
 <div class="sub">${b.file} · ${b.ph?`<span dir="ltr">${b.ph}</span>`:'من غير تليفون'}</div>${b.why?`<div class="why">${b.why}</div>`:''}</div>
 <div class="pacts">${b.due?`<button class="btn sm main" data-t="هيفتح التحصيل لـ ${b.p}">تحصيل</button>`:`<button class="btn sm" data-t="الرصيد بيتخصم تلقائي من أول فاتورة جاية">استخدام الرصيد</button>`}<div class="menu"><button class="btn sm icon" data-menu aria-label="أدوات أكتر">${M}</button><div class="pop"><button data-t="هيفتح كشف حساب المريض">كشف الحساب</button><button data-t="هيفتح ملف المريض الكامل">فتح ملف المريض</button>${b.credit?'<button data-ask="رد رصيد للمريض|'+b.p+' — '+money(b.credit)+' (محتاج موافقة الحسابات)">رد الرصيد</button>':''}</div></div></div></article>`).join(''):'<p class="empty">مفيش مرضى بالفلتر ده.</p>';}
function modal(h){$('#mb').innerHTML=h;$('#bd').classList.add('on');}
function close(){$('#bd').classList.remove('on');}
function pkgModal(id){const k=K.find(x=>x.id===id);
 modal(`<div class="mh"><span class="av">${U}</span><div class="t"><h3>${k.p}</h3><div class="svc"><span class="pill" style="background:var(--tint);color:var(--brand)">${k.n}</span><span class="pill" style="background:var(--soft)">${k.file}</span><span class="pill" style="background:var(--soft)">الصلاحية ${k.exp}</span></div></div><button class="x" data-close aria-label="إغلاق">✕</button></div>
 <div class="tot"><div><small>قيمة التعاقد</small><b>${money(k.price)}</b></div><div><small>اتدفع</small><b>${money(k.paid)}</b></div><div class="rest"><small>مطلوب دلوقتي</small><b>${money(k.due)}</b></div></div>
 <h4 class="h4">الزيارات — ${k.done} من ${k.visits}</h4><div class="vtl">${Array.from({length:Math.min(k.visits,6)},(_,i)=>{const s=i<k.done?'done':i===k.done?'next':'';return `<div class="vstep ${s}"><span class="dot">${i<k.done?'✓':i+1}</span><div class="n"><b style="font-size:13px">زيارة ${i+1} · ${k.svc}</b></div><span class="sub">${s==='done'?'اتنفذت':s==='next'?'الجاية':'لسه'}</span></div>`}).join('')}${k.visits>6?`<p class="sub" style="margin:0">+ ${k.visits-6} زيارات كمان</p>`:''}</div>
 <h4 class="h4">الدفعات</h4><div class="vtl">${k.inst.map(i=>`<div class="inst"><div class="n" style="display:grid;gap:2px"><b style="font-size:13px">${i[0]}</b><small>${i[1]}</small></div><span class="amt">${money(i[2])}</span>${i[3]==='paid'?'<span class="pill done">اتدفع</span>':i[3]==='due'?`<button class="btn sm main" data-collect="${k.id}">تحصيل</button>`:'<span class="pill" style="background:var(--soft);color:var(--muted)">جاي</span>'}</div>`).join('')}</div>
 <div class="mf"><button class="btn" data-t="هيطبع إيصال الباكج">طباعة إيصال</button>${k.state!=='ended'?`<button class="btn" data-ask="طلب إيقاف الباكج وتسويته|${k.p} — ${k.n}">طلب إيقاف وتسوية</button>`:''}</div>`);}
function ask(what,who){modal(`<div class="conf"><h3>تأكيد: ${what}</h3><p>${who}</p><div class="mf"><button class="btn" data-close>رجوع</button><button class="btn main" data-close data-t="${what} — اتسجل (تجربة)">تأكيد</button></div></div>`);}
document.addEventListener('click',e=>{const t=e.target.closest('button');$$('.pop.on').forEach(p=>{if(!t||!p.parentElement.contains(t))p.classList.remove('on');});if(!t)return;
 if(t.dataset.v){$$('.seg button').forEach(b=>b.classList.toggle('on',b===t));$$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+t.dataset.v));return;}
 if(t.dataset.kf){kf=t.dataset.kf;drawK();return;}
 if(t.dataset.tf){kf=t.dataset.tf;drawK();$('#klist').scrollIntoView({behavior:'smooth',block:'start'});return;}
 if(t.dataset.bf){bf=t.dataset.bf;drawB();return;}
 if('menu' in t.dataset){t.nextElementSibling.classList.toggle('on');return;}
 if(t.dataset.open){pkgModal(+t.dataset.open);return;}
 if(t.dataset.collect){const k=K.find(x=>x.id===+t.dataset.collect);modal(`<div class="mh"><div class="t"><h3>تحصيل للباكج</h3><div class="sub">${k.p} · ${k.n}</div></div><button class="x" data-close aria-label="إغلاق">✕</button></div><div class="tot"><div class="rest"><small>المطلوب دلوقتي</small><b>${money(k.due)}</b></div><div><small>باقي التعاقد</small><b>${money(k.price-k.paid)}</b></div><div><small>رصيد المريض</small><b>${money(0)}</b></div></div><p class="sub" style="margin:0">هيفتح نفس نموذج التحصيل الحالي (المبلغ + الطريقة + المرجع) — الشكل بس اللي اتغير.</p><div class="mf"><button class="btn" data-close>رجوع</button><button class="btn main" data-close data-t="اتسجل التحصيل (تجربة)">تحصيل ${money(k.due)}</button></div>`);return;}
 if(t.dataset.ask){const [w,who]=t.dataset.ask.split('|');ask(w,who);return;}
 if('close' in t.dataset){close();if(t.dataset.t)toast(t.dataset.t);return;}
 if(t.dataset.t)toast(t.dataset.t);});
$('#bd').addEventListener('click',e=>{if(e.target.id==='bd')close();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();});
$('#kq').oninput=e=>{kq=e.target.value.trim();drawK();};$('#bq').oninput=e=>{bq=e.target.value.trim();drawB();};
drawK();drawB();
</script>
</body>
</html>

*{box-sizing:border-box;margin:0}
:root{--ink:#16212E;--mut:#65748a;--line:#E3E9F4;--blue:#0F369D;--or:#F15A22;--ok:#2F7D5C;--bad:#D0402A}
body{font-family:"Hiragino Kaku","BigVesta Arabic",system-ui,sans-serif;background:#F4F7FD;color:var(--ink);padding:14px;font-size:14px}
button,select,input{font:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;display:grid;gap:12px;grid-template-columns:minmax(0,1fr)}.card,.week,.row>*{min-width:0}.fl{flex-wrap:wrap}.wd{min-width:0;overflow:hidden}
.banner{background:#E4F3EC;color:var(--ok);border-radius:12px;padding:8px 12px;font-size:12.5px;font-weight:700}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:12px}
.top{display:flex;align-items:center;gap:8px;position:relative}.top .tt{flex:1;min-width:0}.top small{color:var(--mut);font-size:12.5px;display:block}.top small b{color:var(--blue)}.top h1{font-size:20px;color:var(--blue)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:0 16px;border-radius:12px;font-weight:700;font-size:13.5px;white-space:nowrap;background:#fff;color:var(--blue);border:0;box-shadow:inset 0 0 0 1px #C9D6F2;cursor:pointer}
.btn.p{background:var(--blue);color:#fff;box-shadow:none}.btn.o{background:var(--or);color:#fff;box-shadow:none}.btn.g{background:var(--ok);color:#fff;box-shadow:none}.btn.r{background:var(--bad);color:#fff;box-shadow:none}.btn.sq{width:40px;padding:0;color:var(--ink)}.btn.s{min-height:34px;padding:0 12px}
.row{display:flex;gap:8px;align-items:center}
.fld{flex:1;min-width:0;min-height:40px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:#fff;font-size:13px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:#F7F9FE;border-radius:14px;padding:6px}
.wd{border:0;background:none;border-radius:10px;padding:6px 2px;display:grid;gap:2px;justify-items:center;cursor:pointer;font-size:12px;color:var(--mut)}.wd b{font-size:16px;color:var(--ink)}.wd i{width:5px;height:5px;border-radius:50%;background:transparent}.wd i.on{background:var(--blue)}
.wd.sel{background:#fff;box-shadow:0 1px 6px rgba(15,54,157,.12);color:var(--blue)}.wd.sel b{color:var(--blue)}.wd.off{background:repeating-linear-gradient(135deg,#EEF1F6 0 6px,#F7F9FC 6px 12px);cursor:default}.wd.off b{text-decoration:line-through;color:var(--mut)}.wd em{font-style:normal;font-size:10.5px}
.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 13px;border-radius:999px;border:1px solid var(--line);font-size:13px;background:#fff;cursor:pointer}.chip b{margin-inline-end:6px}.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.chip.z{color:var(--mut)}
.closed{border:1px solid #F5D9A8;background:#FFF6E6;border-radius:12px;padding:10px 12px;font-size:13px;color:#7a4b00}
.tl{display:grid}
.hrow{display:grid;grid-template-columns:62px 1fr;gap:10px}
.hl{font-weight:800;color:var(--blue);font-size:13px;padding-top:4px;text-align:end;white-space:nowrap}
.hb{position:relative;border-inline-start:2px solid #D5DEF0;padding:0 0 14px 0;padding-inline-start:16px}
.hb:before{content:"";position:absolute;inset-inline-start:-7px;top:6px;width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid var(--blue)}
.hrow.past .hb:before{border-color:#B9C6DE;background:#EDF1F8}.hrow.past .hl{color:var(--mut)}
.hrow.gap .hb:before{width:8px;height:8px;inset-inline-start:-5px;border-width:2px;border-color:#B9C6DE;top:8px}.hrow.gap .hl{color:var(--mut);font-weight:400;padding-top:3px}.hrow.gap .hb{padding-bottom:10px;color:var(--mut);font-size:12.5px;padding-top:3px;line-height:1.2}
.hrow:last-child .hb{padding-bottom:0}
.now{display:grid;grid-template-columns:62px 1fr;gap:10px;align-items:center;margin:2px 0 8px}
.now .hl{color:var(--or);padding:0}.now .ln{position:relative;border-inline-start:2px solid #D5DEF0;height:22px}
.now .ln:before{content:"";position:absolute;inset-inline-start:-6px;top:50%;margin-top:-5px;width:10px;height:10px;border-radius:50%;background:var(--or)}
.now .ln:after{content:"";position:absolute;inset-inline-start:6px;inset-inline-end:0;top:50%;border-top:2px dashed var(--or)}
.pts{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chp{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:999px;border:1px solid var(--line);background:#F7F9FE;font-weight:700;font-size:13px;cursor:pointer}.chp i{font-style:normal;font-weight:400;color:var(--mut);font-size:12px}
.chp .dot{width:9px;height:9px;border-radius:50%;background:#8b97a8}.k-confirmed .dot{background:var(--ok)}.k-arrived .dot{background:var(--blue)}.k-no_show .dot{background:var(--or)}.k-cancelled{opacity:.55;text-decoration:line-through}
.chp.sel{background:var(--blue);color:#fff;border-color:var(--blue)}.chp.sel i{color:#cfdcff}.chp.cur{box-shadow:0 0 0 3px #DCE6FF}
.open{flex-basis:100%;border:1px solid var(--line);border-inline-start:5px solid #8b97a8;border-radius:14px;padding:12px;display:grid;gap:8px;background:#fff}
.open.k-confirmed{border-inline-start-color:var(--ok)}.open.k-arrived{border-inline-start-color:var(--blue)}.open.k-no_show{border-inline-start-color:var(--or)}
.open small{color:var(--mut)}.st{font-size:12px;font-weight:700;padding:3px 9px;border-radius:9px;background:#EEF1F6}.st.ok{background:#E4F3EC;color:var(--ok)}.st.bl{background:#E3EBFF;color:var(--blue)}.st.or{background:#FFE8DC;color:var(--or)}
.menu{display:grid;gap:6px}.menu button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;text-align:start;cursor:pointer}.menu button.dng{color:var(--bad)}
.pop{position:absolute;top:46px;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 26px rgba(15,54,157,.14);padding:6px;display:grid;width:210px;z-index:5}.pop button{border:0;background:none;padding:10px;text-align:start;border-radius:8px;cursor:pointer}.pop button:hover{background:#F4F7FD}
.empty{color:var(--mut);padding:14px;text-align:center}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw}.toast.on{opacity:1}
.back{position:fixed;inset:0;background:rgba(22,33,46,.45);display:grid;place-items:center;padding:16px;z-index:9}.modal{background:#fff;border-radius:20px;box-shadow:0 24px 60px rgba(15,54,157,.25);width:min(440px,100%);padding:20px;display:grid;gap:14px}.modal h3{font-size:17px}.modal .who{background:#F7F9FE;border-radius:12px;padding:10px 12px;font-size:13px}.modal .row{justify-content:flex-start}
@media(min-width:561px){.fl .fld:first-child{flex:1 1 auto!important}.fl{flex-wrap:nowrap}}@media(max-width:560px){.btn.sq{width:36px}.top{gap:6px}.top .btn.p{padding:0 12px}.wd{font-size:11px}.wd b{font-size:15px}.week{gap:2px;padding:4px}.top h1{font-size:18px}.hrow,.now{grid-template-columns:54px 1fr}}
body{line-height:1.6}.top small{line-height:1.5;margin-bottom:2px}.top h1{line-height:1.35}.banner{line-height:1.7}.chp,.chip,.btn,.st{line-height:1.4}.hl{line-height:1.4}@media(max-width:400px){.wd{font-size:10px}.wd b{font-size:14px}.wd span{letter-spacing:-.3px}.week{padding:3px;gap:1px}}</style>

A(22,'11:00 ص',11,'منى علي','د. سارة','confirmed',{src:'واتساب'}),
A(22,'11:30 ص',11,'كريم سعيد','د. هشام','booked'),
A(22,'1:00 م',13,'هدى إبراهيم','د. سارة','booked'),
A(22,'3:00 م',15,'نورا سامي','د. هشام','cancelled'),
A(24,'12:00 م',12,'عمر فتحي','د. سارة','booked'),
A(24,'1:30 م',13,'دعاء رمضان','د. هشام','confirmed')];
const OFF={23:'عيد تجريبي'};
const LBL={booked:'محجوز',confirmed:'مؤكد',arrived:'حضر',no_show:'لم يحضر',cancelled:'ملغي'};
let S={day:22,q:'',doc:'',st:'',f:'all',open:null,menu:false,pop:false};
const NOW={d:22,h:10,m:5};
const $=s=>document.querySelector(s),toast=m=>{const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>t.classList.remove('on'),1900)};
const hlabel=h=>((h%12)||12)+':00 '+(h<12?'ص':'م');
const inDay=()=>P.filter(p=>p.d===S.day);
const base=p=>(!S.doc||p.doc===S.doc)&&(!S.st||p.k===S.st)&&(!S.q||(p.n+p.doc+p.file).includes(S.q));
const CH=[['all','الكل',p=>p.k!=='cancelled'],['confirmed','مؤكد',p=>p.k==='confirmed'],['arrived','حضروا',p=>p.k==='arrived'],['no_show','لم يحضر',p=>p.k==='no_show']];
function card(p){
 const sel=S.open===p.id,cur=S.day===NOW.d&&p.cur;
 const chip=`<button class="chp k-${p.k} ${sel?'sel':''} ${cur?'cur':''}" data-open="${p.id}"><span class="dot"></span><i>${p.t.replace(' ص','').replace(' م','')}</i> ${p.n}${p.src?` <i>${p.src}</i>`:''}</button>`;
 if(!sel)return chip;
 const main=p.k==='booked'||p.k==='confirmed'?`<button class="btn p" data-act="arrive" data-id="${p.id}">تسجيل حضور</button>`:'';
 const st=p.k==='confirmed'?'ok':p.k==='arrived'?'bl':p.k==='no_show'?'or':'';
 const items=[p.k==='booked'?'<button data-act="confirm" data-id="'+p.id+'">تأكيد الحجز</button>':'',(p.k==='booked'||p.k==='confirmed')?'<button data-a="soon">تغيير الميعاد</button><button data-ask="noshow" data-id="'+p.id+'">لم يحضر</button><button class="dng" data-ask="cancel" data-id="'+p.id+'">إلغاء الحجز</button>':'','<button data-a="soon">ملف المريض</button>'].join('');
 return chip+`<div class="open k-${p.k}"><div class="row"><b style="font-size:15px;flex:1">${p.n}</b><span class="st ${st}">${LBL[p.k]}${p.at?' '+p.at:''}</span></div><small>${p.t} · ${p.doc} · ${p.svc} · رقم الملف ${p.file}</small>${main}<div class="menu">${items}</div></div>`;
}
function timeline(list){
 if(!list.length)return '<p class="empty">مفيش مواعيد بالفلتر ده. جرّب «الكل».</p>';
 const hs=list.map(p=>p.h),min=Math.min(...hs),max=Math.max(...hs);let out='',put=S.day!==NOW.d,h=min;
 const mark='<div class="now"><span class="hl" style="line-height:1.15;font-size:12px">الآن<br><small style="font-weight:400">10:05 ص</small></span><div class="ln"></div></div>';
 while(h<=max){const here=list.filter(p=>p.h===h);
  if(!put&&h>NOW.h){out+=mark;put=true}
  if(here.length){const past=S.day===NOW.d&&h<NOW.h&&here.every(p=>p.k!=='booked'&&p.k!=='confirmed');
   out+=`<div class="hrow ${past?'past':''}"><div class="hl">${hlabel(h)}</div><div class="hb"><div class="pts">${here.map(card).join('')}</div></div></div>`;
   if(!put&&h===NOW.h){}
   h++}
  else{let e=h;while(e+1<=max&&!list.some(p=>p.h===e+1))e++;
   out+=`<div class="hrow gap"><div class="hl">${hlabel(h)}</div><div class="hb">${e>h?'من '+hlabel(h)+' لـ '+hlabel(e)+' · فاضي':'فاضي'}</div></div>`;h=e+1}
 }
 if(!put)out+=mark;return out}
function render(){
 const day=inDay().filter(base),filt=day.filter(CH.find(c=>c[0]===S.f)[2]===undefined?()=>1:p=>S.f==='all'?1:p.k===S.f);
 const vis=S.f==='all'?day:filt;
 const docs=[...new Set(inDay().map(p=>p.doc))];
 const off=OFF[S.day];
 $('#root').innerHTML=`
 <div class="top"><div class="tt"><small>${S.day} نوفمبر 2026${S.day===22?' · <b>النهارده</b>':''}</small><h1>${NAMES[S.day]}</h1></div><button class="btn sq" data-a="soon" aria-label="الأسبوع اللي فات">→</button><button class="btn sq" data-a="soon" aria-label="الأسبوع الجاي">←</button><button class="btn sq" data-a="menu" aria-label="المزيد">⋯</button><button class="btn p" data-a="book">حجز موعد</button>${S.menu?'<div class="pop"><button data-a="soon">تسجيل موعد يدوي</button><button data-a="soon">صوت التنبيهات: شغّال</button><button data-a="soon">تحديث</button></div>':''}</div>
 <div class="row"><div class="week" style="flex:1">${DAYS.map(([n,d])=>`<button class="wd ${S.day===d?'sel':''} ${OFF[d]?'off':''}" data-day="${d}"><span>${n}</span><b>${d}</b>${OFF[d]?'<em>أجازة</em>':`<i class="${P.some(p=>p.d===d&&p.k!=='cancelled')?'on':''}"></i>`}</button>`).join('')}</div></div>
 <div class="row fl"><input class="fld" data-in="q" style="flex:1 1 100%" placeholder="بحث: اسم المريض أو رقم الملف أو التليفون" value="${S.q}"><select class="fld" style="flex:.55" data-sel="doc"><option value="">كل الأطباء</option>${docs.map(d=>`<option ${S.doc===d?'selected':''}>${d}</option>`).join('')}</select><select class="fld" style="flex:.55" data-sel="st"><option value="">كل الحالات</option>${["booked","confirmed","arrived","no_show","cancelled"].map(k=>`<option value="${k}" ${S.st===k?'selected':''}>${LBL[k]}</option>`).join('')}</select></div>
 <div class="chips">${CH.map(([k,l,fn])=>{const n=day.filter(fn).length;return `<button class="chip ${S.f===k?'on':''} ${n===0&&k!=='all'?'z':''}" data-f="${k}"><b>${n}</b>${l}</button>`}).join('')}</div>
 ${off?`<div class="closed"><b>أجازة رسمية: ${off}</b><br>المركز مقفول والحجز متوقف في اليوم ده.</div>`:`<div class="tl">${timeline(vis)}</div>`}`;
}
const find=i=>P.find(p=>p.id==i);
function ask(kind,i){const p=find(i),t=kind==='cancel'?'إلغاء الحجز':'تسجيل «لم يحضر»';
 $('#dlg').innerHTML=`<div class="back"><div class="modal" role="dialog"><h3>${t}؟</h3><div class="who"><b>${p.n}</b><br>${p.t} · ${p.doc}</div><p style="color:var(--mut);font-size:13px">${kind==='cancel'?'الموعد هيتشال من جدول الدكتور.':'هيتسجل إن المريض ما حضرش.'}</p><div class="row"><button class="btn r" data-go="${kind}" data-id="${i}">${kind==='cancel'?'أيوه، إلغاء الحجز':'أيوه، لم يحضر'}</button><button class="btn" data-go="no">رجوع</button></div></div></div>`}
document.addEventListener('click',e=>{const t=e.target.closest('[data-day],[data-f],[data-open],[data-act],[data-ask],[data-go],[data-a]');
 if(!t){if(S.menu){S.menu=false;render()}return}
 if(t.dataset.go){const k=t.dataset.go;$('#dlg').innerHTML='';if(k!=='no'){const p=find(t.dataset.id);p.k=k==='cancel'?'cancelled':'no_show';S.open=null;toast(k==='cancel'?'اتلغى حجز '+p.n:'اتسجل: '+p.n+' لم يحضر')}render();return}
 if(t.dataset.ask){ask(t.dataset.ask,t.dataset.id);return}
 if(t.dataset.day){if(OFF[t.dataset.day]){S.day=+t.dataset.day}else S.day=+t.dataset.day;S.open=null;S.f='all'}
 else if(t.dataset.f)S.f=t.dataset.f;
 else if(t.dataset.open)S.open=S.open==t.dataset.open?null:+t.dataset.open;
 else if(t.dataset.act){const p=find(t.dataset.id);if(t.dataset.act==='arrive'){p.k='arrived';p.at='10:06 ص';toast(p.n+' — اتسجل حضوره')}else{p.k='confirmed';toast('اتأكد حجز '+p.n)}S.open=null}
 else if(t.dataset.a==='menu')S.menu=!S.menu;
 else{S.menu=false;toast(t.dataset.a==='book'?'تصور: هنا بيتفتح «حجز موعد» الحالي':'تصور بس — الشاشة دي ما اتغيّرتش')}
 render()});
document.addEventListener('input',e=>{if(e.target.dataset.in==='q'){S.q=e.target.value;const p=e.target.selectionStart;render();const i=$('[data-in=q]');i.focus();i.setSelectionRange(p,p)}});
document.addEventListener('change',e=>{if(e.target.dataset.sel){S[e.target.dataset.sel]=e.target.value;render()}});
render();
</script></html>

 all:{chips:['الكل','نقدي','فيزا','إنستا باي','تأمين','صرف ومرتجع'],html:function(){return '<div class="note">التاب ده هو «حركات الوردية بالتفصيل» زي ما هو النهارده بالظبط — مفيش حاجة فيه اتشالت ولا اتغيّرت.</div>'+

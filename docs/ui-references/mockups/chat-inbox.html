<!doctype html>
<html lang="ar" dir="rtl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>الرسايل والتعليقات — تصور تفاعلي</title>
<style>
@font-face{font-family:"BigVesta Arabic";src:url("../../../assets/fonts/BigVesta-Regular.woff2") format("woff2");font-weight:400}
@font-face{font-family:"BigVesta Arabic";src:url("../../../assets/fonts/BigVesta-Bold.woff2") format("woff2");font-weight:700}
@font-face{font-family:"Hiragino Kaku";src:url("../../../assets/fonts/Hiragino-W3.woff2") format("woff2");font-weight:300}
@font-face{font-family:"Hiragino Kaku";src:url("../../../assets/fonts/Hiragino-W6.woff2") format("woff2");font-weight:600}
*{box-sizing:border-box;margin:0}
:root{--blue:#0F369D;--or:#F15A22;--ink:#16212E;--ok:#2F7D5C;--bad:#D0402A;--mut:#667085;--line:#E3E9F4;--bg:#F4F7FD;--teal:#00B0BD}
html,body{height:100%}
body{font-family:"Hiragino Kaku","BigVesta Arabic",system-ui,Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.55}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.banner{max-width:1400px;margin:12px auto 0;padding:8px 14px;border-radius:12px;background:#E4F3EC;color:var(--ok);font-size:12.5px;font-weight:600}
.page{max-width:1400px;margin:0 auto;padding:12px 16px 16px;display:grid;gap:12px}
/* top: title + tabs (same tabs as today) */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:20px;color:var(--blue);margin-inline-end:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap}
.tab.on{background:var(--blue);border-color:var(--blue);color:#fff}
.tab .n{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;margin-inline-start:6px;border-radius:999px;background:var(--or);color:#fff;font-size:11.5px}
.tab.alert{border-color:#F5C2B8;color:var(--bad)}
.tab.alert.on{background:var(--bad);border-color:var(--bad);color:#fff}
/* 3 panes */
.inbox{display:grid;grid-template-columns:340px minmax(0,1fr) 280px;gap:12px;height:calc(100vh - 150px);min-height:560px}
.inbox.no-info{grid-template-columns:340px minmax(0,1fr)}
.pane{background:#fff;border:1px solid var(--line);border-radius:18px;min-width:0;min-height:0;display:flex;flex-direction:column;overflow:hidden}
/* list */
.list-head{padding:14px 14px 10px;display:grid;gap:10px;border-bottom:1px solid var(--line)}
.search{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.search input{border:0;background:none;outline:none;flex:1;min-width:0}
.filters{display:flex;gap:16px;border-bottom:1px solid var(--line);margin:0 -14px;padding:0 14px}
.filters button{border:0;background:none;padding:4px 0 8px;color:var(--mut);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.filters button.on{color:var(--blue);border-bottom-color:var(--or)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:12.5px;white-space:nowrap}
.chip.on{background:#EEF2FB;border-color:#C9D6F2;color:var(--blue);font-weight:600}
.cards{overflow:auto;padding:8px;display:grid;gap:4px;align-content:start}
.conv{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border-radius:14px;border:0;background:none;text-align:start;width:100%}
.conv:hover{background:var(--bg)}
.conv.on{background:#EEF2FB}
.conv.sensitive{box-shadow:inset -3px 0 0 var(--bad)}
.av{position:relative;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:17px;color:#fff;background:var(--blue)}
.av .pl{position:absolute;bottom:-2px;inset-inline-start:-2px;width:18px;height:18px;border-radius:50%;border:2px solid #fff;display:grid;place-items:center;font-size:9px;font-weight:700}
.pl.fb{background:#1877F2;color:#fff}.pl.ig{background:linear-gradient(45deg,#F58529,#DD2A7B,#8134AF);color:#fff}
.conv-mid{min-width:0;display:grid;gap:2px}
.conv-name{display:flex;align-items:center;gap:6px;min-width:0}
.conv-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-prev{display:block;color:var(--mut);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.conv-end{display:grid;justify-items:end;gap:4px}
.conv-time{font-size:11.5px;color:var(--mut);white-space:nowrap}
.unread{min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--or);color:#fff;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.done-dot{width:8px;height:8px;border-radius:50%;background:#B9C6DE}
.brand{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:7px;background:#F2F4F7;color:#475467;white-space:nowrap}
/* chat */
.chat-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
.chat-head .av{width:40px;height:40px;font-size:16px}
.chat-title{min-width:0;margin-inline-end:auto}
.chat-title b{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat-title small{color:var(--mut);white-space:nowrap}
.status{font-size:12px;font-weight:600;padding:3px 10px;border-radius:9px;white-space:nowrap}
.st-new{background:#FFF1EA;color:#B5410F}.st-replied{background:#E4F3EC;color:var(--ok)}.st-skipped{background:#F2F4F7;color:var(--mut)}
.ibtn{min-width:38px;min-height:38px;border-radius:12px;border:1px solid var(--line);background:#fff;display:inline-grid;place-items:center;color:var(--blue);font-weight:700;padding:0 10px;white-space:nowrap}
.back{display:none}
.msgs{flex:1;overflow:auto;padding:16px 18px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(#FBFCFF,#FBFCFF)}
.post{align-self:stretch;display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px dashed #C9D6F2;border-radius:14px;background:#fff;margin-bottom:6px;font-size:13px}
.post .thumb{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,#0F369D,#00B0BD);flex:none}
.post small{color:var(--mut);display:block}
.day{align-self:center;margin:10px 0 4px;font-size:11.5px;color:var(--mut);background:#EEF1F6;padding:2px 12px;border-radius:999px}
.sys{align-self:center;max-width:80%;text-align:center;font-size:12px;color:var(--mut);padding:2px 10px}
.b{max-width:min(520px,78%);display:grid;gap:2px}
.b p{padding:9px 14px;border-radius:16px;white-space:pre-wrap;overflow-wrap:anywhere}
.b time{font-size:11px;color:var(--mut);padding:0 6px}
.b.them{align-self:flex-start}
.b.them p{background:#fff;border:1px solid var(--line);border-start-start-radius:6px}
.b.me{align-self:flex-end}
.b.me p{background:var(--blue);color:#fff;border-start-end-radius:6px}
.b.me time{text-align:end}
.b.me .who{font-size:11px;color:var(--mut);padding:0 6px;text-align:end}
.b.auto p{background:#EEF2FB;color:var(--ink);border:1px solid #C9D6F2}
.composer{border-top:1px solid var(--line);padding:10px 12px;display:grid;gap:8px}
.composer textarea{width:100%;min-height:46px;max-height:140px;resize:vertical;border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--bg);outline:none}
.composer textarea:focus{border-color:var(--blue);background:#fff}
.comp-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.comp-row .hint{color:var(--mut);font-size:12px;margin-inline-end:auto;min-width:0}
.send{background:var(--or);color:#fff;border:0;border-radius:12px;min-height:40px;padding:0 18px;font-weight:700;white-space:nowrap}
.ghost{background:#fff;border:1px solid #C9D6F2;color:var(--blue);border-radius:12px;min-height:40px;padding:0 14px;font-weight:600;white-space:nowrap}
.closed-note{padding:12px 16px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px;background:#FAFBFD}
.empty{flex:1;display:grid;place-items:center;color:var(--mut);padding:30px;text-align:center}
/* info */
.info{padding:18px 16px;display:grid;gap:14px;align-content:start;overflow:auto}
.info .av{width:72px;height:72px;font-size:28px;justify-self:center}
.info h3{text-align:center;font-size:17px}
.info .sub{text-align:center;color:var(--mut);font-size:12.5px;margin-top:-10px}
.acts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.act{display:grid;justify-items:center;gap:4px;border:0;background:none;font-size:12px;color:var(--ink)}
.act span{width:42px;height:42px;border-radius:50%;background:#EEF2FB;color:var(--blue);display:grid;place-items:center;font-size:17px}
.facts{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:12px}
.facts dt{font-size:12px;color:var(--mut)}.facts dd{font-weight:600;overflow-wrap:anywhere}.facts dd.no{font-weight:400;color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:8px;background:#FDE9E5;color:var(--bad);font-weight:600}
.link-card{border:1px solid var(--line);border-radius:14px;padding:10px 12px;display:grid;gap:6px;font-size:13px}
.link-card b{color:var(--blue)}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;opacity:0;transition:.2s;pointer-events:none;max-width:90vw;z-index:50}
.toast.on{opacity:1}
/* phones: list and chat are two screens */
@media(max-width:1100px){.inbox,.inbox.no-info{grid-template-columns:320px minmax(0,1fr)}.inbox .info-pane{display:none}.inbox.show-info .info-pane{display:flex;position:fixed;inset:auto 0 0 0;max-height:80vh;border-radius:20px 20px 0 0;z-index:40;box-shadow:0 -12px 40px rgba(15,54,157,.2)}}
@media(max-width:760px){
 .page{padding:8px 10px 10px}
 .top h1{font-size:18px}
 .inbox,.inbox.no-info{grid-template-columns:minmax(0,1fr);height:calc(100vh - 140px)}
 .inbox.open .list-pane{display:none}
 .inbox:not(.open) .chat-pane{display:none}
 .back{display:inline-grid}
 .b{max-width:86%}
 .comp-row .hint{flex-basis:100%;order:3}
 .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px}.tab{text-align:center}
 .top{display:grid;gap:8px}
 .banner{margin:8px 10px 0}
}
</style>
<div class="banner">تصور تفاعلي — جرّب: دوس على أي محادثة، بدّل بين «الرسايل» و«التعليقات»، الفلاتر، «ⓘ» للبيانات، واكتب رد واضغط «إرسال». مفيش حاجة بتتبعت فعلاً.</div>
<div class="page" id="app"></div>
<div class="toast" id="toast"></div>
<script>
const NOW=new Date('2026-11-22T18:10:00');
const d=(day,h,m)=>new Date(2026,10,day,h,m);
const CONVS={
 messages:[
  {id:'m1',name:'وليد حجازي',pl:'fb',brand:'سونو',status:'replied',phone:'',lead:'ليد — تعاقدات طبية',items:[
   {t:'them',at:d(22,17,6),x:'وليد حجازي'},
   {t:'me',at:d(22,17,10),x:'محتاج توضيح أكتر علشان أفهم حضرتك 🙏\nحضرتك محتاج/ة أنهي خدمة؟ (علاج طبيعي، ليزر، أسنان، أو خدمة تانية)',auto:1},
   {t:'them',at:d(22,17,34),x:'يا فندم انا بقدم خدمة التعاقدات الطبية مع شركات التأمين و شركات الرعاية الطبية'},
   {t:'them',at:d(22,17,34),x:'لو حضراتكم محتاجين تعاقدات'},
   {t:'sys',at:d(22,17,34),x:'اتنقل لمرحلة: مؤهّل'},
   {t:'me',at:d(22,19,58),x:'هيتم التواصل مع حضرتك من الادارة',by:'منى (الاستقبال)'}]},
  {id:'m2',name:'سارة محمود',pl:'ig',brand:'د. دينا',status:'new',phone:'01012345678',lead:'',items:[
   {t:'them',at:d(21,22,15),x:'السلام عليكم، هو الكشف عند دكتورة دينا بكام؟'},
   {t:'me',at:d(21,22,16),x:'وعليكم السلام 🌸 سعر الكشف 400 جنيه، وتقدري تحجزي من هنا أو على واتساب 01000000000',auto:1},
   {t:'them',at:d(22,18,2),x:'تمام، ينفع بكرة الساعة 5؟'},
   {t:'them',at:d(22,18,3),x:'ورقمي 01012345678'}]},
  {id:'m3',name:'أحمد سمير',pl:'fb',brand:'سونو',status:'new',sensitive:1,phone:'',lead:'',items:[
   {t:'them',at:d(22,16,40),x:'أنا جيت امبارح ومستني ساعتين ومحدش عبّرني، ده مش احترام'},
   {t:'me',at:d(22,16,41),x:'بنعتذر جداً لحضرتك، وهيتواصل معاك حد من الإدارة النهارده.',auto:1},
   {t:'sys',at:d(22,16,41),x:'🚨 اتصنّفت شكوى — محتاجة حد من الفريق يتواصل'}]},
  {id:'m4',name:'منة الله',pl:'ig',brand:'سونو',status:'replied',phone:'',lead:'',items:[
   {t:'them',at:d(20,13,0),x:'عندكم ليزر إزالة شعر؟'},
   {t:'me',at:d(20,13,1),x:'أيوه عندنا 👌 تحبي نحجزلك جلسة استشارة؟',auto:1},
   {t:'them',at:d(20,13,20),x:'شكراً'}]},
  {id:'m5',name:'Mohamed Adel',pl:'fb',brand:'سونو',status:'skipped',phone:'',lead:'',items:[
   {t:'them',at:d(19,9,12),x:'Earn 500$ daily from home!! click here'},
   {t:'sys',at:d(19,9,12),x:'اتصنّفت سبام — مفيش رد'}]}
 ],
 comments:[
  {id:'c1',name:'هبة عادل',pl:'fb',brand:'سونو',status:'new',post:'عرض العلاج الطبيعي — نوفمبر',items:[
   {t:'them',at:d(22,17,50),x:'العرض ده لحد إمتى؟ وهل فيه جلسات للأطفال؟'}]},
  {id:'c2',name:'كريم فتحي',pl:'ig',brand:'سونو',status:'replied',post:'افتتاح عيادة الأسنان',items:[
   {t:'them',at:d(22,11,5),x:'مبروك 👏 فين المكان بالظبط؟'},
   {t:'me',at:d(22,11,6),x:'الله يبارك فيك 🙏 حدائق الأهرام — البوابة الرابعة، والحجز على 01000000000',auto:1}]},
  {id:'c3',name:'نهى سامي',pl:'fb',brand:'د. دينا',status:'new',post:'نصايح التغذية للحوامل',items:[
   {t:'them',at:d(21,20,40),x:'ممكن أعرف مواعيد الدكتورة يوم السبت؟'},
   {t:'them',at:d(21,20,41),x:'ولو سمحتوا محتاجة أحجز أونلاين'}]}
 ]
};
let S={tab:'messages',f:'all',pl:'',q:'',open:null,info:true,mobileInfo:false,draft:{}};
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const tm=x=>x.toLocaleTimeString('ar-EG-u-nu-latn',{hour:'numeric',minute:'2-digit'});
const dayKey=x=>x.toDateString();
function dayLabel(x){const t=new Date(NOW);const y=new Date(NOW);y.setDate(y.getDate()-1);if(dayKey(x)===dayKey(t))return 'النهارده';if(dayKey(x)===dayKey(y))return 'امبارح';return x.toLocaleDateString('ar-EG-u-nu-latn',{weekday:'long',day:'numeric',month:'long'})}
function listTime(x){return dayKey(x)===dayKey(NOW)?tm(x):dayLabel(x)}
const last=c=>c.items.filter(i=>i.t!=='sys').slice(-1)[0];
function unread(c){let n=0;for(let i=c.items.length-1;i>=0;i--){if(c.items[i].t==='me')break;if(c.items[i].t==='them')n++}return c.status==='new'?n:0}
const ST={new:['محتاج رد','st-new'],replied:['تم الرد','st-replied'],skipped:['سبام','st-skipped']};
const PL={fb:['f','fb'],ig:['◎','ig']};
const platName=(c)=>S.tab==='messages'?(c.pl==='fb'?'ماسنجر':'انستجرام دايركت'):(c.pl==='fb'?'تعليق فيسبوك':'تعليق انستجرام');
function visible(){return CONVS[S.tab].filter(c=>(S.f==='all'||(S.f==='new'?c.status==='new':c.status!=='new'))&&(!S.pl||c.pl===S.pl)&&(!S.q||(c.name+c.items.map(i=>i.x).join(' ')).includes(S.q))).sort((a,b)=>last(b).at-last(a).at)}
function avatar(c,big){return `<span class="av" style="background:${c.pl==='ig'?'#8134AF':'#0F369D'}">${esc(c.name.trim().charAt(0))}<i class="pl ${PL[c.pl][1]}">${PL[c.pl][0]}</i></span>`}
function card(c){const l=last(c),u=unread(c);return `<button class="conv${S.open===c.id?' on':''}${c.sensitive?' sensitive':''}" data-open="${c.id}">${avatar(c)}<span class="conv-mid"><span class="conv-name"><b>${esc(c.name)}</b><span class="brand">${esc(c.brand)}</span></span><span class="conv-prev">${l.t==='me'?'أنت: ':''}${esc(l.x.split('\n')[0])}</span></span><span class="conv-end"><span class="conv-time">${listTime(l.at)}</span>${u?`<span class="unread">${u}</span>`:'<span class="done-dot" aria-hidden="true"></span>'}</span></button>`}
function thread(c){let out='',prev='';if(c.post)out+=`<div class="post"><span class="thumb"></span><span><small>تعليق على بوست</small><b>${esc(c.post)}</b></span></div>`;
 c.items.forEach(i=>{const k=dayKey(i.at);if(k!==prev){out+=`<div class="day">${dayLabel(i.at)}</div>`;prev=k}
  if(i.t==='sys'){out+=`<div class="sys">${esc(i.x)} · ${tm(i.at)}</div>`;return}
  out+=`<div class="b ${i.t}${i.auto?' auto':''}">${i.t==='me'?`<span class="who">${i.auto?'رد تلقائي':esc(i.by||'الصفحة')}</span>`:''}<p>${esc(i.x)}</p><time>${tm(i.at)}</time></div>`});
 return out}
function chat(c){if(!c)return `<div class="empty"><div><b style="font-size:16px;color:var(--blue)">اختار محادثة من القايمة</b><p>هتفتح هنا زي شات واتساب.</p></div></div>`;
 const st=ST[c.status];const isC=S.tab==='comments';
 const comp=c.status==='skipped'?`<div class="closed-note">المحادثة دي اتصنّفت سبام، مفيش رد.</div>`:
  `<div class="composer"><textarea data-draft="${c.id}" placeholder="${isC?'اكتب الرد على التعليق…':'اكتب رسالة…'}">${esc(S.draft[c.id]||'')}</textarea><div class="comp-row"><span class="hint">${isC?'بيانات الحجز (العنوان والتليفون) بتتضاف لوحدها لو مش موجودة.':'ماسنجر بيسمح بالرد خلال 24 ساعة من آخر رسالة من العميل.'}</span><button class="ghost" data-a="suggest">✨ اقترح رد</button>${isC&&c.status==='new'?'<button class="ghost" data-a="ignore">تجاهل</button>':''}<button class="send" data-a="send">${isC?'اعتمد وانشر':'إرسال'}</button></div></div>`;
 return `<div class="chat-head"><button class="ibtn back" data-a="back" aria-label="رجوع">→</button>${avatar(c)}<span class="chat-title"><b>${esc(c.name)}</b><small>${platName(c)} · ${esc(c.brand)}</small></span><span class="status ${st[1]}">${st[0]}</span><button class="ibtn" data-a="meta" title="افتح على ميتا">↗</button><button class="ibtn" data-a="info" aria-label="بيانات العميل">ⓘ</button></div><div class="msgs" id="msgs">${thread(c)}</div>${comp}`}
function info(c){if(!c)return '';const isC=S.tab==='comments';
 return `<div class="info">${avatar(c)}<h3>${esc(c.name)}</h3><p class="sub">${platName(c)} · ${esc(c.brand)}</p>
 <div class="acts"><button class="act" data-a="meta"><span>↗</span>${isC?'افتح التعليق':'افتح المحادثة'}</button><button class="act" data-a="book"><span>📅</span>احجز موعد</button><button class="act" data-a="lead"><span>🔗</span>${c.lead?'افتح الليد':'اربط بليد'}</button></div>
 ${c.sensitive?'<div><span class="tag">شكوى — محتاجة تواصل</span></div><button class="send" data-a="resolve">تم التعامل</button>':''}
 <dl class="facts"><div><dt>التليفون</dt>${c.phone?`<dd>${c.phone}</dd>`:'<dd class="no">مش متسجل — لو كتبه في الشات اضغط «اربط بليد»</dd>'}</div><div><dt>الحالة</dt><dd>${ST[c.status][0]}</dd></div><div><dt>أول رسالة</dt><dd>${dayLabel(c.items[0].at)} ${tm(c.items[0].at)}</dd></div>${isC?`<div><dt>البوست</dt><dd>${esc(c.post)}</dd></div>`:''}</dl>
 ${c.lead?`<div class="link-card"><span class="muted">مربوط بـ</span><b>${esc(c.lead)}</b></div>`:''}</div>`}
function render(){const list=visible();if(S.open&&!CONVS[S.tab].some(c=>c.id===S.open))S.open=null;const c=CONVS[S.tab].find(x=>x.id===S.open);
 const pend=t=>CONVS[t].filter(x=>x.status==='new').length,alerts=CONVS.messages.filter(x=>x.sensitive).length;
 $('#app').innerHTML=`<div class="top"><h1>التعليقات والرسايل</h1><div class="tabs"><button class="tab${S.tab==='messages'?' on':''}" data-tab="messages">الرسايل<span class="n">${pend('messages')}</span></button><button class="tab${S.tab==='comments'?' on':''}" data-tab="comments">التعليقات<span class="n">${pend('comments')}</span></button><button class="tab" data-a="soon">الردود المعتمدة</button><button class="tab alert" data-a="soon">🚨 تنبيهات<span class="n" style="background:var(--bad)">${alerts}</span></button></div></div>
 <div class="inbox${S.info&&c?'':' no-info'}${S.open?' open':''}${S.mobileInfo?' show-info':''}">
  <section class="pane list-pane"><div class="list-head"><label class="search"><span aria-hidden="true">🔍</span><input data-q placeholder="دوّر باسم أو كلمة" value="${esc(S.q)}"></label>
   <div class="filters">${[['all','الكل'],['new','محتاج رد'],['done','تم الرد']].map(f=>`<button class="${S.f===f[0]?'on':''}" data-f="${f[0]}">${f[1]}</button>`).join('')}</div>
   <div class="chips">${[['','الكل'],['fb',S.tab==='messages'?'ماسنجر':'فيسبوك'],['ig','انستجرام']].map(p=>`<button class="chip${S.pl===p[0]?' on':''}" data-pl="${p[0]}">${p[1]}</button>`).join('')}<button class="chip" data-a="soon">كل الصفحات ⌄</button></div></div>
   <div class="cards">${list.map(card).join('')||'<p class="empty">مفيش حاجة بالفلتر ده.</p>'}</div></section>
  <section class="pane chat-pane">${chat(c)}</section>
  ${c&&S.info?`<aside class="pane info-pane">${S.mobileInfo?'<div style="padding:10px 16px 0;text-align:end"><button class="ibtn" data-a="info">✕</button></div>':''}${info(c)}</aside>`:''}
 </div>`;
 const m=$('#msgs');if(m)m.scrollTop=m.scrollHeight}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.k);toast.k=setTimeout(()=>e.classList.remove('on'),2000)}
document.addEventListener('click',e=>{const t=e.target.closest('[data-tab],[data-open],[data-f],[data-pl],[data-a]');if(!t)return;
 if(t.dataset.tab){S.tab=t.dataset.tab;S.open=null;S.mobileInfo=false}
 else if(t.dataset.open){S.open=t.dataset.open;S.mobileInfo=false}
 else if(t.dataset.f)S.f=t.dataset.f;
 else if(t.dataset.pl!==undefined)S.pl=t.dataset.pl;
 else{const a=t.dataset.a,c=CONVS[S.tab].find(x=>x.id===S.open);
  if(a==='back')S.open=null;
  else if(a==='info'){if(innerWidth<=1100){S.info=true;S.mobileInfo=!S.mobileInfo}else S.info=!S.info}
  else if(a==='send'&&c){const v=(S.draft[c.id]||'').trim();if(!v){toast('اكتب الرد الأول');return}c.items.push({t:'me',at:new Date(NOW),x:v,by:'أنت'});c.status='replied';S.draft[c.id]='';toast(S.tab==='comments'?'اتنشر الرد (تصور)':'اتبعتت الرسالة (تصور)')}
  else if(a==='suggest'&&c){S.draft[c.id]=S.tab==='comments'?'أهلاً بحضرتك 🌸 العرض لحد آخر الشهر، وفيه جلسات للأطفال. للحجز: 01000000000':'أهلاً بحضرتك 🌸 تحت أمرك، ممكن تقولنا الوقت المناسب ونحجزلك؟'}
  else if(a==='ignore'&&c){c.status='replied';toast('اتجاهل التعليق (تصور)')}
  else if(a==='resolve'&&c){c.sensitive=0;toast('اتسجل «تم التعامل» (تصور)')}
  else toast({meta:'هيفتح المحادثة على فيسبوك/انستجرام',book:'هيفتح «حجز موعد» ببيانات العميل',lead:'هيربط المحادثة بليد أو ملف مريض',soon:'الشاشة دي زي ما هي'}[a]||'تصور')}
 render()});
document.addEventListener('input',e=>{if(e.target.matches('[data-q]')){S.q=e.target.value;const p=e.target.selectionStart;render();const i=$('[data-q]');i.focus();i.setSelectionRange(p,p)}else if(e.target.dataset.draft)S.draft[e.target.dataset.draft]=e.target.value});
if(innerWidth>760)S.open='m1';
render();
</script>
</html>

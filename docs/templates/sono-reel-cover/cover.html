<html><head><style>html{overflow:hidden}
/* Swnw reel cover (1080×1920) in the approved carousel-cover style (Mohamed 2026-10-11).
   Faces must sit in the clear top area (y 80–760) — the photo block is 1000px tall and fades out under the text, so pick/crop the photo so faces are near the top and not over-zoomed (Mohamed 2026-10-12).
   Keep the title inside the middle 1080×1440 (profile grid crop): y 240–1680. */
@font-face{font-family:BV;src:url(../../../assets/fonts/BigVesta-Regular.woff2);font-weight:400}
@font-face{font-family:BV;src:url(../../../assets/fonts/BigVesta-Bold.woff2);font-weight:700}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:BV;direction:rtl;background:#0F369D;color:#fff}
.ph{display:none}.pf{position:absolute;z-index:2;left:50%;top:var(--top,150px);width:var(--w,92%);transform:translateX(-50%);border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35);-webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 100%);mask-image:linear-gradient(to bottom,#000 84%,transparent 100%)}
.ov{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 60% at 50% 18%,#2a5bd0 0%,#0F369D 55%,#0a2a7c 100%)}
.logo{position:absolute;top:70px;left:60px;width:300px;z-index:6;filter:drop-shadow(0 4px 14px rgba(0,0,0,.35))}
.t{position:absolute;right:60px;left:60px;bottom:330px;text-align:right;z-index:5}
.tag{display:inline-block;background:#F15A22;color:#fff;font-weight:700;font-size:40px;padding:10px 30px;border-radius:34px}
h1{font-weight:700;font-size:96px;line-height:1.24;margin:26px 0 18px}
.or{color:#F15A22}
p{font-size:46px;color:#dbe6ff}
.play{position:absolute;right:70px;bottom:220px;z-index:5;display:flex;align-items:center;gap:14px;font-weight:700;font-size:38px;color:#fff}
.play b{width:64px;height:64px;border-radius:50%;background:#F15A22;display:flex;align-items:center;justify-content:center;font-size:30px}
</style></head><body><div class=ph></div><img class=pf src="PHOTO.jpg"><div class=ov></div>
<img class=logo src="../../../assets/design-templates/reel-cover/sono_logo_white.png">
<div class=t><span class=tag>عادات يومية</span><h1><span class=or>5</span> حاجات في الشغل<br>بتتعب <span class=or>ضهرك</span></h1><p>من غير ما تاخد بالك</p></div>
<div class=play><b>▶</b>شوف الفيديو</div>
</body></html>

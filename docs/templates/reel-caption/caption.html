<!doctype html>
<!-- Reel caption «box» style (Mohamed 2026-10-11, font fix 2026-11-14): ONE short caption chunk (2–5 words)
     in a white rounded box that hugs the words, lower third. Transparent 1080×1920 PNG: render with omitBackground:true,
     one PNG per chunk, overlay on the footage with ffmpeg for that chunk's time.
     Query params: brand=sono|dina · text=<caption chunk> · hl=<word(s) to colour, space separated>
     Fonts are loaded from assets/fonts (Swnw = BigVesta, Dr. Dina = Tajawal). After load the page sets
     <body data-ready="1">; if the brand font did NOT load it sets data-ready="font-missing" — never screenshot then. -->
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><style>
@font-face{font-family:SwnwCap;src:url(../../../assets/fonts/BigVesta-Bold.woff2) format('woff2');font-weight:700}
@font-face{font-family:DinaCap;src:url(../../../assets/fonts/Tajawal-Bold.ttf) format('truetype');font-weight:700}
html,body{margin:0;width:1080px;height:1920px;background:transparent;overflow:hidden}
.wrap{position:absolute;left:60px;right:60px;bottom:430px;display:flex;justify-content:center}
.cap{display:inline-block;max-width:960px;background:#fff;color:#16212E;border-radius:34px;padding:14px 28px 22px;
  font-weight:700;font-size:68px;line-height:1.25;text-align:center;white-space:nowrap;box-shadow:0 6px 22px rgba(0,0,0,.22)}
body.sono .cap{font-family:SwnwCap} body.sono .hl{color:#F15A22}
body.dina .cap{font-family:DinaCap} body.dina .hl{color:#E3141B}
</style></head><body>
<div class="wrap"><div class="cap" id="c"></div></div>
<script>
var q=new URLSearchParams(location.search),brand=q.get('brand')==='dina'?'dina':'sono';
document.body.className=brand;
var hl=(q.get('hl')||'').split(/\s+/).filter(Boolean);
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
document.getElementById('c').innerHTML=(q.get('text')||'').replace(/[.،,]+$/,'').split(/\s+/).map(function(w){
  var b=w.replace(/[؟?!.,،]/g,'');return hl.indexOf(b)>-1||hl.indexOf(b.replace(/^و/,''))>-1?'<span class="hl">'+esc(w)+'</span>':esc(w);}).join(' ');
var fam=brand==='dina'?'DinaCap':'SwnwCap';
document.fonts.load('700 68px '+fam).then(function(){return document.fonts.ready;}).then(function(){
  var c=document.getElementById('c'),z=68;while(c.scrollWidth>960&&z>44){z-=2;c.style.fontSize=z+'px';}
  document.body.dataset.ready=document.fonts.check('700 68px '+fam)?'1':'font-missing';
},function(){document.body.dataset.ready='font-missing';});
</script></body></html>

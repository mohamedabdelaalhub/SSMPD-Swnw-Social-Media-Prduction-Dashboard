<html><head><link rel=stylesheet href=sono.css><style>
/* Offer / campaign — layout 3 "packages" (Mohamed approved 2026-11-10). Light blue background, SOFT round shapes
   (big one top-right, small one bottom-left — never sharp triangles), two-line title, three round photos each with a package card, orange CTA. Frame: frame_light.png. */
body{background:#EAF5FE}
.sh{position:absolute;inset:0}
.t{position:absolute;top:165px;left:60px;width:960px;display:flex;flex-direction:column;align-items:center;gap:34px;text-align:center;z-index:6}
.l1{font-weight:700;font-size:104px;line-height:1.12;color:#F15922}
.l2{font-weight:700;font-size:104px;line-height:1.12;color:#0F369D}
.row{display:flex;gap:40px;justify-content:center}
.col{width:280px;display:flex;flex-direction:column;align-items:center;gap:26px}
.col .im{width:280px;height:280px;border-radius:50%;border:8px solid #0F369D;background:#fff center/cover}
.card{width:280px;background:#fff;border:2px solid #DCE5F5;border-radius:26px;padding:18px 14px 22px;display:flex;flex-direction:column;gap:6px}
.card b{font-weight:700;font-size:34px;line-height:1.3;color:#0F369D}
.card span{font-weight:400;font-size:26px;line-height:1.4;color:#4A5563}
.cta{margin-top:14px;background:#F15A22;color:#fff;font-weight:700;font-size:42px;line-height:1.3;padding:10px 52px 16px;border-radius:60px;box-shadow:0 12px 26px rgba(241,90,34,.28)}
</style></head><body>
<svg class=sh viewBox="0 0 1080 1350"><circle cx="1080" cy="0" r="260" fill="#16C2E3"/><circle cx="1080" cy="0" r="200" fill="#1D4FD0"/><circle cx="1080" cy="0" r="140" fill="#0F369D"/><circle cx="0" cy="1350" r="180" fill="#16C2E3" opacity=".45"/><circle cx="0" cy="1350" r="115" fill="#1D4FD0"/></svg>
<img class=frame src=frame_light.png>
<div class=t><div><div class=l1>باقــــــــــات</div><div class=l2>البلاك فرايدي</div></div>
<div class=row>
<div class=col><div class=im style="background-image:url(PHOTO1.jpg)"></div><div class=card><b>اسم الباقة 1</b><span>تفاصيل الباقة</span></div></div>
<div class=col><div class=im style="background-image:url(PHOTO2.jpg)"></div><div class=card><b>اسم الباقة 2</b><span>تفاصيل الباقة</span></div></div>
<div class=col><div class=im style="background-image:url(PHOTO3.jpg)"></div><div class=card><b>اسم الباقة 3</b><span>تفاصيل الباقة</span></div></div>
</div><div class=cta>احجزي باقتك دلوقتي</div></div>
</body></html>

<html><head><style>html{overflow:hidden}
/* Dr. Dina reel cover (1080×1920) in the approved Dina carousel-cover style. Never her photo unless it is a kit frame. */
@font-face{font-family:T;src:url(../../../assets/fonts/Tajawal-Medium.ttf);font-weight:500}
@font-face{font-family:T;src:url(../../../assets/fonts/Tajawal-Bold.ttf);font-weight:700}
@font-face{font-family:T;src:url(../../../assets/fonts/Tajawal-Black.ttf);font-weight:900}
*{margin:0;box-sizing:border-box}
body{width:1080px;height:1920px;position:relative;overflow:hidden;font-family:T;direction:rtl;background:#2c0b26;color:#fff}
.ph{display:none}.pf{position:absolute;z-index:2;left:50%;top:var(--top,150px);width:var(--w,92%);transform:translateX(-50%);border-radius:28px;box-shadow:0 18px 50px rgba(0,0,0,.35);-webkit-mask-image:linear-gradient(to bottom,#000 84%,transparent 100%);mask-image:linear-gradient(to bottom,#000 84%,transparent 100%)}
.ov{position:absolute;inset:0;z-index:1;background:radial-gradient(120% 60% at 50% 18%,#7a2a66 0%,#5a1b4a 55%,#2c0b26 100%)}
.logo{position:absolute;top:70px;left:60px;width:170px;z-index:6;filter:drop-shadow(0 4px 14px rgba(0,0,0,.3))}
.t{position:absolute;right:70px;left:70px;bottom:330px;text-align:right;z-index:5}
.tag{display:inline-block;background:#E3141B;color:#fff;font-weight:700;font-size:40px;padding:8px 30px;border-radius:34px}
h1{font-weight:900;font-size:112px;line-height:1.24;margin:26px 0 18px}
.red{color:#ff4b52}
p{font-weight:500;font-size:48px;color:#f6edd6}
.play{position:absolute;right:70px;bottom:220px;z-index:5;display:flex;align-items:center;gap:14px;font-weight:700;font-size:40px}
.play b{width:64px;height:64px;border-radius:50%;background:#E3141B;display:flex;align-items:center;justify-content:center;font-size:30px}
</style></head><body><div class=ph></div><img class=pf src="PHOTO.jpg"><div class=ov></div>
<img class=logo src="../../../assets/design-templates/reel-cover/dina_logo_badge.png">
<div class=t><span class=tag>مخ وأعصاب</span><h1>صداع وتنميل<br><span class=red>ودوخة</span></h1><p>إمتى تقلق وتكشف فورًا</p></div>
<div class=play><b>▶</b>شوف الفيديو</div>
</body></html>

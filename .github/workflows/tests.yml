name: Tests

# Runs the dashboard's automated tests on every pull request and on every push to main,
# so a change that breaks something shows a red mark before it is merged.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  feature-syntax:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check digital team and Sia JavaScript
        run: |
          node --check assets/js/digital-team.js
          node --check assets/js/sia-ui.js
          node --check assets/js/employee-assistant.js
          node --check assets/js/ui-titles.js
          node --check assets/js/scroll-top.js
          node --check assets/js/administrative-assistant.js
          node --check assets/js/administrative-assistant-center.js

      - run: npm ci
      - name: Check digital team navigation and launcher accessibility
        run: node tests/digital-team-navigation.cjs

  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test

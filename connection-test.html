<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اختبار اتصال SWNW</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0;padding:24px;color:#172033}main{max-width:640px;margin:auto;background:#fff;border:1px solid #e4e9f2;border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(0,0,0,.05)}h1{font-size:24px;margin:0 0 10px}.muted{color:#6b7280}.row{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-top:12px}.ok{background:#ecfdf3;border-color:#bbf7d0}.bad{background:#fff1f2;border-color:#fecdd3}.wait{background:#fffbeb;border-color:#fde68a}button,a.btn{display:inline-block;margin-top:14px;padding:12px 16px;border-radius:12px;border:0;background:#0f3a8d;color:#fff;text-decoration:none;font-weight:700;cursor:pointer}code{direction:ltr;display:inline-block;font-size:12px;word-break:break-all}</style>
</head>
<body><main>
<h1>اختبار اتصال الداشبورد</h1>
<p class="muted">الصفحة دي خفيفة جدًا وبتختبر GitHub Pages وخادم Supabase مباشرة من جهازك.</p>
<div id="github" class="row ok">✅ GitHub Pages يعمل — الصفحة وصلت لجهازك.</div>
<div id="supabase" class="row wait">⏳ جاري اختبار الاتصال بخادم Supabase…</div>
<div id="details" class="row" style="display:none"></div>
<button id="retry">إعادة الاختبار</button>
<a class="btn" href="./">الرجوع للداشبورد</a>
<script>
(function(){
  var endpoint='https://uuijfbpgvtdxgaosqpxo.supabase.co/auth/v1/health';
  var box=document.getElementById('supabase'),details=document.getElementById('details');
  async function run(){
    box.className='row wait'; box.textContent='⏳ جاري اختبار الاتصال بخادم Supabase…'; details.style.display='none';
    var controller=new AbortController(); var timer=setTimeout(function(){controller.abort();},8000);
    var started=performance.now();
    try{
      var r=await fetch(endpoint,{method:'GET',cache:'no-store',signal:controller.signal});
      clearTimeout(timer);
      var ms=Math.round(performance.now()-started);
      box.className='row ok'; box.textContent='✅ الاتصال بـ Supabase ناجح — استجابة '+r.status+' خلال '+ms+' ms';
      details.style.display='block'; details.innerHTML='<b>النتيجة:</b> المشكلة ليست حظرًا للشبكة. ارجع للداشبورد وجرب الدخول مرة أخرى.<br><code>'+endpoint+'</code>';
    }catch(e){
      clearTimeout(timer);
      var ms=Math.round(performance.now()-started);
      box.className='row bad'; box.textContent='❌ الجهاز لم يستطع الوصول إلى Supabase';
      details.style.display='block'; details.innerHTML='<b>الخطأ:</b> '+String(e&&e.name||'Error')+' — '+String(e&&e.message||e)+'<br><b>الزمن:</b> '+ms+' ms<br><br>ده معناه إن الطلب اتوقف قبل خادم Supabase. جرّب شبكة مختلفة/Hotspot أو أوقف VPN/Content Filter، ثم أعد الاختبار.<br><code>'+endpoint+'</code>';
    }
  }
  document.getElementById('retry').onclick=run; run();
})();
</script>
</main></body></html>

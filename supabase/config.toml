# Supabase project config — currently only used to declare per-function
# settings that the CLI/Dashboard read (this repo is NOT deployed via
# `supabase functions deploy`; deployment stays manual via the Dashboard's
# Monaco editor per CLAUDE.md — see note in project changelog for the exact
# manual toggle needed alongside this file).

[functions.media-buyer-propose]
# This function is called machine-to-machine by an external agent using a
# static bearer secret (MEDIA_BUYER_AGENT_TOKEN), not a Supabase Auth user
# session — so it must NOT go through platform JWT verification. The
# function's own code still rejects every request without a valid
# MEDIA_BUYER_AGENT_TOKEN (see supabase/functions/media-buyer-propose/index.ts).
verify_jwt = false

[functions.media-buyer-pair]
# Phase 2B pairing bridge: serves TWO callers on one endpoint —
# create_pairing_code (a logged-in dashboard manager, real Supabase Auth JWT)
# and register_agent (the external agent itself, no dashboard session at all,
# authenticated only via the one-time pairing code). Since the second caller
# has no platform JWT, this function must NOT go through platform JWT
# verification either — create_pairing_code validates the manager's JWT
# manually inside the function (see getCallerManager in
# supabase/functions/media-buyer-pair/index.ts).
verify_jwt = false

[functions.meta-publish-process]
# This function is called machine-to-machine every minute by pg_cron (via
# net.http_post), not a Supabase Auth user session — so it must NOT go
# through platform JWT verification. The function's own code rejects every
# request whose X-Cron-Secret header doesn't match META_PUBLISH_CRON_SECRET
# (see supabase/functions/meta-publish-process/index.ts).
verify_jwt = false


[functions.booking-sync-ingest]
# Machine-to-machine endpoint called by the AI Customer Agent after a
# deterministic booking lifecycle event. It authenticates with its own
# BOOKING_SYNC_SECRET header; no dashboard user JWT is involved.
verify_jwt = false

[functions.patient-portal-documents]
# Auth is validated with auth.getUser inside the function. Dashboard legacy JWT toggle: OFF.
verify_jwt = false
